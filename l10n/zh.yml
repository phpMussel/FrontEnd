hints_time_format:
 zh-Hans: |
  <strong><em>占位符 – 解释 – 基于2024-04-30T18:27:49+08:00的示例。</em></strong><br />
  <code class="s">{yyyy}</code> – 年份 – 例如，2024。<br />
  <code class="s">{yy}</code> – 缩写年份 – 例如，24。<br />
  <code class="s">{Mon}</code> – 月份缩写名称（英文） – 例如，Apr。<br />
  <code class="s">{mm}</code> – 带前导零的月份 – 例如，04。<br />
  <code class="s">{m}</code> – 月份数 – 例如，4。<br />
  <code class="s">{Day}</code> – 当天缩写名称（英文） – 例如，Tue。<br />
  <code class="s">{dd}</code> – 带前导零的天数 – 例如，30。<br />
  <code class="s">{d}</code> – 天数 – 例如，30。<br />
  <code class="s">{hh}</code> – 带前导零的小时（使用24小时制） – 例如，18。<br />
  <code class="s">{h}</code> – 小时（使用24小时制） – 例如，18。<br />
  <code class="s">{ii}</code> – 带前导零的分钟 – 例如，27。<br />
  <code class="s">{i}</code> – 分钟 – 例如，27。<br />
  <code class="s">{ss}</code> – 带前导零的秒 – 例如，49。<br />
  <code class="s">{s}</code> – 秒 – 例如，49。<br />
  <code class="s">{tz}</code> – 时区（不带冒号） – 例如，+0800。<br />
  <code class="s">{t:z}</code> – 时区（带冒号） – 例如，+08:00。
 zh-Hant: |
  <strong><em>佔位符 – 解釋 – 基於2024-04-30T18:27:49+08:00的範例。</em></strong><br />
  <code class="s">{yyyy}</code> – 年份 – 例如，2024。<br />
  <code class="s">{yy}</code> – 縮寫年份 – 例如，24。<br />
  <code class="s">{Mon}</code> – 月份的縮寫名稱（英文） – 例如，Apr。<br />
  <code class="s">{mm}</code> – 帶前導零的月份 – 例如，04。<br />
  <code class="s">{m}</code> – 月數 – 例如，4。<br />
  <code class="s">{Day}</code> – 當天的縮寫名稱（英文） – 例如，Tue。<br />
  <code class="s">{dd}</code> – 帶前導零的天數 – 例如，30。<br />
  <code class="s">{d}</code> – 天數 – 例如，30。<br />
  <code class="s">{hh}</code> – 帶前導零的小時（使用24小時制） – 例如，18。<br />
  <code class="s">{h}</code> – 小時（使用24小時制） – 例如，18。<br />
  <code class="s">{ii}</code> – 帶前導零的分鐘 – 例如，27。<br />
  <code class="s">{i}</code> – 分鐘 – 例如，27。<br />
  <code class="s">{ss}</code> – 帶前導零的秒 – 例如，49。<br />
  <code class="s">{s}</code> – 秒 – 例如，49。<br />
  <code class="s">{tz}</code> – 時區（不含冒號） – 例如，+0800。<br />
  <code class="s">{t:z}</code> – 時區（附冒號） – 例如，+08:00。
hints_xlists:
 zh-Hans: "<strong>这是如何工作的。</strong> 如果您的系统只允许具体文件类型被上传，​或如果您的系统明确地否认某些文件类型，​指定那些文件类型在白名单，​黑名单和灰名单可以增加扫描执行速度通过允许脚本跳过某些文件类型。​格式是CSV（逗号分隔变量）。<br /><br /><strong>进程的逻辑顺序。</strong> 如果文件类型已白名单，​不扫描和不受阻文件，​和不匹配文件对照黑名单或灰名单。​如果文件类型已黑名单，​不扫描文件但阻止它无论如何，​和不匹配文件对照灰名单。​如果灰名单是空，​或如果灰名单不空和文件类型已灰名单，​扫描文件像正常和确定如果阻止它基于扫描结果，​但如果灰名单不空和文件类型不灰名单，​过程文件仿佛已黑名单，​因此不扫描它但阻止它无论如何。"
 zh-Hant: "<strong>這是如何工作的。</strong> 如果您的系統只允許具體文件類型被上傳，​或如果您的系統明確地否認某些文件類型，​指定那些文件類型在白名單，​黑名單和灰名單可以增加掃描執行速度通過允許腳本跳過某些文件類型。​格式是CSV（逗號分隔變量）。<br /><br /><strong>進程的邏輯順序。</strong> 如果文件類型已白名單，​不掃描和不受阻文件，​和不匹配文件對照黑名單或灰名單。​如果文件類型已黑名單，​不掃描文件但阻止它無論如何，​和不匹配文件對照灰名單。​如果灰名單是空，​或如果灰名單不空和文件類型已灰名單，​掃描文件像正常和確定如果阻止它基於掃描結果，​但如果灰名單不空和文件類型不灰名單，​過程文件彷彿已黑名單，​因此不掃描它但阻止它無論如何。"
Some useful links:
 zh-Hans: |+
  一些有用的链接：<br />
      <ul class="pieul">
        <li><span class="comCat">phpMussel的工具、资源、等等。</span>
          <ul class="comSub">
            <li>{{Links.phpMussel.Issues}} – phpMussel问题页面（支持、协助、等等）。</li>
            <li>{{Links.phpMussel.SigTool}} – 使用ClamAV签名数据库创建phpMussel签名文件。</li>
            <li>{{Links.OSChina}} – phpMussel页面托管在开源中国社区。</li>
            <li>{{Links.phpMussel.Extras}} – 各种附加功能。</li>
          </ul>
        </li>
        <li><span class="comCat">ClamAV的工具、资源、等等。</span>
          <ul class="comSub">
            <li>{{Links.ClamavNet}} – ClamAV主页（ClamAV®是一个开源的防病毒引擎用于检测木马，​病毒，​恶意软件和其他恶意威胁）。</li>
            <li>{{Links.SecuriteInfo}} – 一家计算机安全公司。为ClamAV提供补充签名。</li>
            <li>{{Links.Sanesecurity}} – 一家计算机安全公司。为ClamAV提供补充签名。</li>
            <li>{{Links.Malware Expert}} – 提供ClamAV的补充签名和ModSecurity的补充规则。</li>
          </ul>
        </li>
        <li><span class="comCat">团体、论坛、社区、等等。</span>
          <ul class="comSub">
            <li>{{Links.PHP.Earth.Facebook}} – PHP学习资源和讨论。</li>
            <li>{{Links.MalwareTips}} – 有用的讨论论坛关于恶意软件。</li>
          </ul>
        </li>
        <li><span class="comCat">其他有用的工具、资源、服务、等等</span>
          <ul class="comSub">
            <li>{{Links.PhishTank}} – 网络钓鱼数据库。由phpMussel URL扫描器使用。</li>
            <li>{{Links.VirusTotal}} – VirusTotal是一项免费服务，​用于分析可疑文件和URL。</li>
            <li>{{Links.Hybrid Analysis}} – Hybrid Analysis是由{{Links.Payload Security}}提供的免费恶意软件分析服务。</li>
            <li>{{Links.Malwarebytes}} – 电脑反恶意软件专家。</li>
          </ul>
        </li>
        <li><span class="comCat">信息和学习资源。</span>
          <ul class="comSub">
            <li>{{Links.PHP.Earth.Website}} – PHP学习资源和讨论。</li>
            <li>{{Links.MDN.Homepage}} – 由开发人员，为开发人员提供的资源。这是学习HTML、CSS、JavaScript、可访问性、等内容的绝佳资源。</li>
            <li><a href="https://maikuolan.github.io/Vulnerability-Charts/" hreflang="en-AU" rel="noopener noreferrer external">脆弱性图表</a> – 列出各种软件包的安全/不安全版本（HHVM、PHP、phpMyAdmin、Python、等等）。</li>
            <li><a href="https://maikuolan.github.io/Compatibility-Charts/" hreflang="en-AU" rel="noopener noreferrer external">兼容性图表</a> – 列出各种软件包的兼容性信息（CIDRAM、phpMussel、等等）。</li>
          </ul>
        </li>
      </ul>
