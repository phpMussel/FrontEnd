  zh-Hans: "包含2FA代码的电子邮件已发送到您的电子邮件地址。​请确认以下代码以获取对前端的访问权限。​如果您没有收到此电子邮件，尝试登出，等待10分钟，然后再次登录以接收包含新代码的新电子邮件。"
  zh-Hant: "包含2FA代碼的電子郵件已發送到您的電子郵件地址。​請確認以下代碼以獲取對前端的訪問權限。​如果您沒有收到此電子郵件，嘗試登出，等待10分鐘，然後再次登錄以接收包含新代碼的新電子郵件。"
 Accounts: {"zh-Hans": "帐户页面允许您控制谁可以访问phpMussel前端。", "zh-Hant": "帳戶頁面允許您控制誰可以訪問phpMussel前端。"}
 Cache Data: {"zh-Hans": "在这里您可以查看缓存的内容。", "zh-Hant": "在這裡您可以查看緩存的內容。"}
 Configuration: {"zh-Hans": "配置页面允许您修改phpMussel配置从前端。", "zh-Hant": "配置頁面允許您修改phpMussel配置從前端。"}
 Greeting: "你好，%s。"
 Home: {"zh-Hans": "这是phpMussel的前端主页。​从左侧的导航菜单中选择一个链接以继续。", "zh-Hant": "這是phpMussel的前端主頁。​從左側的導航菜單中選擇一個鏈接以繼續。"}
 Logs: {"zh-Hans": "选择一个日志从下面的列表以查看那个日志的内容。", "zh-Hant": "選擇一個日誌從下面的列表以查看那個日誌的內容。"}
 Quarantine is currently disabled: {"zh-Hans": "注意：隔离目前禁用，但可以通过配置页面启用。", "zh-Hant": "注意：隔離目前禁用，但可以通過配置頁面啟用。"}
 Quarantine: {"zh-Hans": "此页面列出当前在隔离中的所有文件，并可以用来管理这些文件。", "zh-Hant": "此頁面列出當前在隔離中的所有文件，並可以用來管理這些文件。"}
 See the documentation:
  zh-Hans: "请参阅<a href="https://github.com/phpMussel/Docs/blob/master/readme.zh-Hans.md\#user-content-SECTION5" hreflang="zh-Hans" rel="noopener external">文档</a>以获取有关各种配置指令的信息和他们的目的。"
  zh-Hant: "請參閱<a href="https://github.com/phpMussel/Docs/blob/master/readme.zh-Hant.md\#user-content-SECTION5" hreflang="zh-Hant" rel="noopener external">文檔</a>以獲取有關各種配置指令的信息和他們的目的。"
 Signature Information: {"zh-Hans": "签名信息页面提供了有关当前活动签名的来源和类型的一些基本信息。", "zh-Hant": "簽名信息頁面提供了有關當前活動簽名的來源和類型的一些基本信息。"}
 Statistics tracking is currently disabled: {"zh-Hans": "注意：统计跟踪目前已被禁用，但可以通过配置页面启用。", "zh-Hant": "注意：統計跟踪目前已被禁用，但可以通過配置頁面啟用。"}
 Statistics: {"zh-Hans": "此页面显示了有关phpMussel安装的一些基本使用统计信息。", "zh-Hant": "此頁面顯示了有關phpMussel安裝的一些基本使用統計信息。"}
 Upload Testing: {"zh-Hans": "上传测试页面包含标准文件上传表单，​允许您测试是否文件通常会被阻止通过phpMussel当尝试上传他们。", "zh-Hant": "上傳測試頁麵包含標准文件上傳表單，​允許您測試是否文件通常會被阻止通過phpMussel當嘗試上傳他們。"}
warning:
 Cookies: {"zh-Hans": "注意：phpMussel使用cookie来验证登录。​通过登录，您同意您的浏览器创建和存储cookie。", "zh-Hant": "注意：phpMussel使用cookie來驗證登錄。​通過登錄，您同意您的瀏覽器創建和存儲cookie。"}
