config:
 core: "Општа конфигурација (било која конфигурација језгра која не припада другим категоријама)."
 core_default_timeout: "Подразумевано временско ограничење за коришћење за спољне захтеве? Подразумевано = 12 секунди."
 core_delete_on_sight: "Омогућавање ове директиве ће упутити скрипту да покуша одмах да избрише сваки скенирани покушај отпремања датотека који одговара било ком критеријуму детекције, било путем потписа или на неки други начин. Датотеке означене као „чисте“ неће бити диране. У случају архива, цела архива ће бити избрисана, без обзира на то да ли је увредљиви датотека само један од неколико датотека који се налазе у архиви. У случају скенирања отпремања датотека, обично није неопходно да се омогући ова директива, јер обично ПХП аутоматски чисти садржај своје кеш меморије када се извршавање заврши, што значи да ће обично избрисати све датотеке које су отпремљене преко њега на сервер осим ако већ нису премештене, копиране или избрисане. Ова директива је овде додата као додатна мера безбедности за оне чије се копије ПХП-а можда не понашају увек на очекивани начин. Лажно = Након скенирања, оставите датотеку на миру [Подразумевано]; Истинито = Након скенирања, ако није чист, одмах избришите."
 core_disabled_channels: "Ово се може користити да спречи пхпМуссел да користи одређене канале приликом слања захтева."
 core_error_log: "Датотека за евидентирање свих откривених грешака које нису фаталне. Наведите име датотеке, или оставите празно да бисте онемогућили."
 core_hide_version: "Сакрити информације о верзији из евиденције и излаза странице? Истинито = Да; Лажно = Не [Подразумевано]."
 core_ipaddr: "Где пронаћи ИП адресу захтева за повезивање? (Корисно за услуге као што је Цлоудфларе). Подразумевано = REMOTE_ADDR. УПОЗОРЕЊЕ: Промените ово само ако знате шта радите!"
 core_lang: "Одредите подразумевани језик за пхпМуссел."
 core_lang_override: "Локализирати према HTTP_ACCEPT_LANGUAGE кад год је то могуће? Истинито = Да [Подразумевано]; Лажно = Не."
 core_log_rotation_action: "Ротација дневника ограничава број датотека евиденције које би требало да постоје у било ком тренутку. Када се креирају нове датотеке евиденције, ако укупан број датотека евиденције премашује наведено ограничење, биће извршена наведена радња. Овде можете одредити жељену акцију."
 core_log_rotation_limit: "Ротација дневника ограничава број датотека евиденције које би требало да постоје у било ком тренутку. Када се креирају нове датотеке евиденције, ако укупан број датотека евиденције премашује наведено ограничење, биће извршена наведена радња. Овде можете одредити жељено ограничење. Вредност 0 ће онемогућити ротацију дневника."
 core_maintenance_mode: "Омогућити режим одржавања? Истинито = Да; Лажно = Не [Подразумевано]. Онемогућује све осим фронт-енда. Понекад корисно за ажурирање вашег ЦМС-а, оквира, итд."
 core_outbound_request_log: "Датотека за евидентирање резултата свих одлазних захтева. Наведите име датотеке, или оставите празно да бисте онемогућили."
 core_request_proxy: "Ако желите да се одлазни захтеви шаљу преко проксија, овде наведите тај прокси. Ако не, оставите ово празно."
 core_request_proxyauth: "Ако шаљете одлазне захтеве путем проксија и ако тај прокси захтева корисничко име и лозинку, наведите то корисничко име и лозинку овде (нпр., <code>user:pass</code>). Ако не, оставите ово празно."
 core_scan_cache_expiry: "Колико дуго пхпМуссел треба да кешира резултате скенирања? Вредност је број секунди за кеширање резултата скенирања. Подразумевано је 21600 секунди (6 сати); Вредност 0 ће онемогућити кеширање резултата скенирања."
 core_scan_log: "Име датотеке у коју се евидентирају сви резултати скенирања. Наведите име датотеке, или оставите празно да бисте онемогућили."
 core_scan_log_serialized: "Име датотеке у коју се евидентирају сви резултати скенирања (користећи серијализовани формат). Наведите име датотеке, или оставите празно да бисте онемогућили."
 core_statistics: "Пратите статистику коришћења пхпМуссел? Истинито = Да; Лажно = Не [Подразумевано]."
 core_time_format: "Формат записа датума/времена који користи пхпМуссел. Додатне опције се могу додати на захтев."
 core_time_offset: "Померање временске зоне у минутима."
 core_timezone: "Временска зона коју треба користити (нпр., Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, etc). Наведите „SYSTEM“ да бисте дозволили ПХП-у да то аутоматски обави уместо вас."
 core_truncate: "Скратити датотеке евиденције када достигну одређену величину? Вредност је максимална величина у Б/КБ/МБ/ГБ/ТБ до које датотека евиденције може да нарасте пре него што буде скраћена. Подразумевана вредност од 0КБ онемогућава скраћивање (датотеке евиденције могу да расту бесконачно). Белешка: Односи се на појединачне датотеке дневника! Величина датотека евиденције се не разматра заједно."
 experimental: "Нестабилно/Експериментално!"
 files: "Како руковати датотекама приликом скенирања."
 files_allow_leading_trailing_dots: "Дозволити водеће и задње тачке у називима датотека? Ово се понекад може користити да се сакрију датотеке или да се неки системи преваре да дозволе прелазак преко директоријума. Лажно = Не дозволите [Подразумевано]. Истинито = Дозволите."
 files_archive_file_extensions: "Препознате екстензије архивских датотека (формат је ЦСВ; треба додати или уклонити само када дође до проблема; непотребно уклањање може довести до појаве лажних резултата за архивске датотеке, док ће непотребни додаци у суштини ставити на белу листу оно што додајете из детекције специфичног за напад; модификујте са опрезом; такође имајте на уму да ово нема утицаја на то шта архиве могу, а које не могу да се анализирају на нивоу садржаја). Листа, као што је подразумевано, наводи оне формате који се најчешће користе у већини система и ЦМС-а, али намерно није нужно свеобухватна."
 files_block_control_characters: "Блокирати све датотеке које садрже било које контролне знакове (осим нових редова)? Ако отпремате <strong><em>САМО</em></strong> обичан текст, онда омогућавање ове опције може пружити додатну заштиту вашем систему. Међутим, ако отпремате било шта осим обичног текста, омогућавање ове опције може довести до лажних позитивних резултата. Лажно = Не блокирај [Подразумевано]; Истинито = Блокирај."
 files_block_encrypted_archives: "Открити и блокирати шифроване архиве? Пошто пхпМуссел није у стању да скенира садржај шифрованих архива, могуће је да нападач користи шифровање архиве као начин покушаја да заобиђе пхпМуссел, антивирусне скенере и друге такве заштите. Упућивање пхпМуссел-у да блокира све архиве за које открије да су шифроване могло би потенцијално помоћи у смањењу таквог ризика. Лажно = Не; Истинито = Да [Подразумевано]."
 files_block_macros: "Покушајте да блокирате све датотеке које садрже макрое? Неке врсте докумената и табела могу да садрже извршне макрое, што представља опасан потенцијални вектор злонамерног софтвера. Лажно = Не блокирај [Подразумевано]; Истинито = Блокирај."
 files_can_contain_php_file_extensions: "Листа екстензија датотека којима је дозвољено да садрже ПХП код, одвојених зарезима. Ако је детекција ПХП камелеонског напада омогућена, датотеке које садрже ПХП код, које имају екстензије које нису на овој листи, биће откривене као ПХП камелеон напади."
 files_chameleon_from_exe: "Потражите заглавља извршних датотека у датотекама које нису ни извршне ни признате архиве и извршне датотеке чија су заглавља нетачна. Лажно = Онемогућено; Истинито = Омогућено."
 files_chameleon_from_php: "Потражите ПХП заглавља у датотекама које нису ни ПХП датотеке ни признате архиве. Лажно = Онемогућено; Истинито = Омогућено."
 files_chameleon_to_archive: "Откријте нетачна заглавља у архивама и компримованим датотекама. Подржано: BZ/BZIP2, GZ/GZIP, LZF, RAR, ZIP. Лажно = Онемогућено; Истинито = Омогућено."
 files_chameleon_to_doc: "Потражите оффице документе чија су заглавља нетачна (Подржано: DOC, DOT, PPS, PPT, XLA, XLS, WIZ). Лажно = Онемогућено; Истинито = Омогућено."
 files_chameleon_to_img: "Потражите слике чија су заглавља нетачна (Подржано: BMP, DIB, PNG, GIF, JPEG, JPG, XCF, PSD, PDD, WEBP). Лажно = Онемогућено; Истинито = Омогућено."
 files_chameleon_to_pdf: "Потражите ПДФ датотеке чија су заглавља нетачна. Лажно = Онемогућено; Истинито = Омогућено."
 files_check_archives: "Покушати проверите садржај архиве? Лажно = Не проверавајте; Истинито = Проверите [Подразумевано]. Подржано: Zip/Зип (захтева либзип), Tar/Тар, Rar/Рар (захтева rar/рар екстензија)."
 files_corrupted_exe: "Оштећене датотеке и грешке рашчлањивања. Лажно = Занемари; Истинито = Блокирај [Подразумевано]. Открити и блокирати потенцијално оштећене ПЕ (Портабле Екецутабле) датотеке? Често (али не увек), када су одређени аспекти ПЕ датотеке оштећени или се не могу правилно рашчланити, то може указивати на вирусну инфекцију. Ако је програмер вируса свестан како антивирусни програм анализира ПЕ датотеке, може да покуша да то спречи, како би омогућио да њихов вирус остане неоткривен."
 files_decode_threshold: "Максимална дужина необрађених података где треба детектовати команде за декодирање (у случају да постоје приметни проблеми са перформансама током скенирања). Подразумевано = 512KB. Нула уклања свако такво ограничење на основу величине датотеке."
 files_entropy_filesize_limit: "Ограничење величине датотеке ентропије за потписе који користе нормализоване податке (подразумевано је 256КБ). Када се прекорачи и граница ентропије и ограничење величине датотеке ентропије, да би се смањио ризик од лажних позитивних резултата, неки потписи који користе нормализоване податке биће занемарени."
 files_entropy_limit: "Ограничење ентропије за потписе који користе нормализоване податке (подразумевано је 7.7). У овом контексту, ентропија се дефинише као шенонова ентропија садржаја датотеке која се скенира. Када се прекорачи и граница ентропије и ограничење величине датотеке ентропије, да би се смањио ризик од лажних позитивних резултата, неки потписи који користе нормализоване податке биће занемарени."
 files_filesize_archives: "Применити црну/белу листу величине датотека на садржај архива? Лажно = Не (све на сиву листу); Истинито = Да [Подразумевано]."
 files_filesize_limit: "Ограничење величине датотеке у КБ. 65536 = 64МБ [Подразумевано]; 0 = Нема ограничења (увек на сивој листи). Било која (позитивна) нумеричка вредност је прихваћена. Ово може бити корисно када ваша ПХП конфигурација ограничава количину меморије коју процес може да задржи или ако ваша ПХП конфигурација ограничава величину датотеке за отпремање."
 files_filesize_response: "Шта учинити са датотекама које премашују ограничење величине датотеке (ако постоји ограничење). Лажно = Ставите на белу листу; Истинито = Ставите на црну листу [Подразумевано]."
 files_filetype_archives: "Применити црну/белу листу врста датотека на садржај архива? Лажно = Не (све на сиву листу) [Подразумевано]; Истинито = Да."
 files_filetype_blacklist: "Црна листа:"
 files_filetype_greylist: "Сива листа:"
 files_filetype_whitelist: "Бела листа:"
 files_max_files_in_archives: "Максималан број датотека за скенирање из архива пре прекида скенирања. Подразумевано = 0 (без максимума)."
 files_max_recursion: "Максимално ограничење дубине рекурзије за архиве. Подразумевано = 3."
 files_only_allow_images: "Када је подешено на „true“, све датотеке које скенер пронађе, а које нису слике, биће одмах означене, без скенирања. Ово може помоћи у смањењу времена потребног за завршетак скенирања у неким случајевима. Подразумевано постављено на „false“."
 files_scannable_threshold: "Праг за дужину сирових података које пхпМуссел може да чита и скенира (у случају да постоје било какви приметни проблеми са перформансама током скенирања). Подразумевано = 32МБ. Вредност нула онемогућава праг. Генерално, ова вредност не би требало да буде мања од просечне величине датотека отпремљених датотека које желите и очекујете да примите на свој сервер или веб локацију, не би требало да буде веће од директиве filesize_limit, и не би требало да буде већа од отприлике једне петине укупне дозвољене алокације меморије додељене PHP-у путем конфигурационе датотеке „php.ini“. Ова директива постоји да би се спречило да phpMussel користи превише меморије (то би га спречило да успешно скенира датотеке изнад одређене величине)."
 frontend: "Конфигурација за фронт-енд."
 frontend_custom_footer: "Уметнуто као ХТМЛ на самом дну свих фронт-енд страница. Ово би могло бити корисно у случају да на свим таквим страницама желите да укључите правно обавештење, везу за контакт, пословне информације, или слично."
 frontend_custom_header: "Уметнуто као ХТМЛ на самом почетку свих фронт-енд страница. Ово би могло бити корисно у случају да на свим таквим страницама желите да укључите логотип веб странице, персонализовано заглавље, скрипте, или слично."
 frontend_default_algo: "Дефинише који алгоритам ће се користити за све будуће лозинке и сесије."
 frontend_frontend_log: "Датотека за евидентирање покушаја пријављивања на фронт-енд. Наведите име датотеке, или оставите празно да бисте онемогућили."
 frontend_magnification: "Увећање фонта. Подразумевано = 1."
 frontend_max_login_attempts: "Максималан број покушаја пријављивања на фронт-енд. Подразумевано = 5."
 frontend_numbers: "Како желите да се бројеви приказују? Изаберите пример који вам се чини најисправнијим."
 frontend_theme: "Тема која ће се користити за фронт-енд."
 frontend_theme_mode: "Режим за тема која ће се користити за фронт-енд."
 legal: "Конфигурација за законске захтеве."
 legal_privacy_policy: "Адреса релевантне политике приватности која ће се приказати у подножју сваке генерисане странице. Наведите УРЛ, или оставите празно да бисте онемогућили."
 legal_pseudonymise_ip_addresses: "Псеудонимизирати ИП адресе приликом пријављивања? Истинито = Да [Подразумевано]; Лажно = Не."
 quarantine: "Конфигурација за карантин."
 quarantine_quarantine_key: "пхпМуссел може да стави блокиране отпремљене датотеке у карантин, ако то желите. Повремени корисници phpMussel-а који само желе да заштите своје веб странице или окружење за хостинг, без икаквог интересовања за дубинску анализу било каквих покушаја отпремања означених датотека, требало би да ову функционалност оставе онемогућеном, али сви корисници заинтересовани за даљу анализу означених покушаја отпремања датотека ради истраживања злонамерног софтвера или сличних ствари требало би да омогуће ову функционалност. Функционалност карантина понекад може помоћи и у отклањању грешака у лажно позитивним резултатима, ако вам се то често дешава. Да бисте онемогућили функционалност карантина, једноставно оставите директиву <code>quarantine_key</code> празну, или је испразните ако већ није празна. Да бисте омогућили функционалност карантина, унесите неку вредност у директиву. <code>quarantine_key</code> је важна безбедносна карактеристика карантина, потребна као средство за спречавање искоришћавања карантина од стране потенцијалних нападача и као средство за спречавање било каквог потенцијалног извршавања података сачуваних у карантину. <code>quarantine_key</code> треба третирати на исти начин као и ваше лозинке: што дуже то боље, и пажљиво га чувајте. За најбољи ефекат, користите заједно са <code>delete_on_sight</code>."
 quarantine_quarantine_max_files: "Максималан број датотека које могу постојати у карантину. Када се нове датотеке додају у карантин, ако се овај број прекорачи, старе датотеке ће бити обрисане како би се број смањио на испод овог максимума. Подразумевано = 100."
 quarantine_quarantine_max_filesize: "Максимална величина датотеке дозвољена за стављање датотека у карантин. Датотеке веће од наведене вредности НЕЋЕ бити стављене у карантин. Ова директива је важна као средство да се потенцијалним нападачима отежа преплављивање вашег карантина нежељеним подацима, што би потенцијално могло довести до прекомерне потрошње података на вашем услуга хостинга. Подразумевано = 2MB."
 quarantine_quarantine_max_usage: "Максимална дозвољена употреба меморије за карантин. Ако укупна меморија коју користи карантин достигне ову вредност, најстарије датотеке у карантину биће обрисане како би се укупна искоришћена меморија смањила на испод ове вредности. Ова директива је важна као средство да се потенцијалним нападачима отежа преплављивање вашег карантина нежељеним подацима, што би потенцијално могло довести до прекомерне потрошње података на вашем услуга хостинга. Подразумевано = 64MB."
 signatures: "Конфигурација за потписе, датотеке потписа, итд."
 signatures_active: "Листа активних датотека потписа, раздвојених зарезима. Белешка: Датотеке потписа прво морају бити инсталиране, пре него што их можете активирати. Да би тест датотеке исправно функционисале, датотеке потписа морају бити инсталиране и активиране."
 signatures_detect_adware: "Треба ли пхпМуссел користи потписе за откривање адвера? Лажно = Не; Истинито = Да [Подразумевано]."
 signatures_detect_deface: "Треба ли пхпМуссел користи потписе за откривање оштећења веб странице? Лажно = Не; Истинито = Да [Подразумевано]."
 signatures_detect_encryption: "Треба ли пхпМуссел детектује и блокира шифроване датотеке? Лажно = Не; Истинито = Да [Подразумевано]."
 signatures_detect_joke_hoax: "Треба ли пхпМуссел користи потписе за откривање шала/превара злонамерног софтвера и вируса? Лажно = Не; Истинито = Да [Подразумевано]."
 signatures_detect_packer_packed: "Треба ли пхпМуссел користи потписе за откривање паковача и упакованих података? Лажно = Не; Истинито = Да [Подразумевано]."
 signatures_detect_pua_pup: "Треба ли пхпМуссел користи потписе за откривање потенцијално нежељених апликација? Лажно = Не; Истинито = Да [Подразумевано]."
 signatures_detect_shell: "Треба ли пхпМуссел користи потписе за откривање шел скрипти? Лажно = Не; Истинито = Да [Подразумевано]."
 signatures_fail_extensions_silently: "Треба ли пхпМуссел пријави када недостају екстензије? Ако је <code>fail_extensions_silently</code> онемогућено, недостајуће екстензије ће бити пријављене приликом скенирања, а ако је <code>fail_extensions_silently</code> омогућено, недостајуће екстензије ће бити игнорисане, а скенирање ће извештавати о оним датотекама за које нема проблема. Онемогућавање ове директиве може потенцијално повећати вашу безбедност, али може довести и до повећања броја лажно позитивних. Лажно = Онемогућено; Истинито = Омогућено [Подразумевано]."
 signatures_fail_silently: "Треба ли пхпМуссел треба да пријави када датотеке потписа недостају или су оштећене? Ако је <code>fail_silently</code> искључено, недостајуће и оштећене датотеке ће бити пријављене приликом скенирања, а ако је <code>fail_silently</code> омогућено, недостајуће и оштећене датотеке ће бити игнорисане, а скенирање ће извештавати о оним датотекама за које нема никаквих проблема. Ово треба променити само ако имате проблема као што су падови система или слично. Лажно = Онемогућено; Истинито = Омогућено [Подразумевано]."
 signatures_heuristic_threshold: "Неки пхпМуссел потписи су намењени да идентификују где датотеке могу бити сумњиве, без директног идентификовања тих датотека као злонамерних. Ова вредност означава максималну дозвољену тежину пре него што пхпМуссел треба да означи те датотеке као злонамерне. Дефиниција тежине у овом контексту је укупан број идентификованих сумњивих и потенцијално злонамерних индикатора. Подразумевано, ова вредност ће бити постављена на 3. Нижа вредност ће генерално резултирати већом појавом лажно позитивних, али већим бројем означених злонамерних датотека, док ће виша вредност генерално резултирати мањом појавом лажно позитивних, али мањим бројем означених злонамерних датотека. Најбоље је да промените ову вредност само ако имате проблема."
 supplementary_cache_options: "Додатне опције кеша. Белешка: Промена ових вредности може вас потенцијално одјави."
