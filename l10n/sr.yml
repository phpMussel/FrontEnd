 supplementary_cache_options_enable_memcached: "Одређује да ли да покушате да користите Мемцацхед за кеширање. Подразумевано = False."
 supplementary_cache_options_enable_pdo: "Одређује да ли да покушате да користите ПДО за кеширање. Подразумевано = False."
 supplementary_cache_options_enable_redis: "Одређује да ли да покушате да користите Редис за кеширање. Подразумевано = False."
 supplementary_cache_options_memcached_host: "Мемцацхед вредност хоста. Подразумевано = localhost."
 supplementary_cache_options_memcached_port: "Мемцацхед вредност порта. Подразумевано = „11211“."
 supplementary_cache_options_pdo_dsn: "ПДО вредност ДСН-а. Подразумевано = „mysql:dbname=phpmussel;host=localhost;port=3306“."
 supplementary_cache_options_pdo_password: "ПДО лозинка."
 supplementary_cache_options_pdo_username: "ПДО корисничко име."
 supplementary_cache_options_prefix: "Овде наведена вредност биће додата свим кључевима за унос у кеш меморију. Подразумевано = „phpMussel_“. Када постоји више инсталација на истом серверу, ово може бити корисно за држање њихових кешова одвојених један од другог."
 supplementary_cache_options_redis_database_number: "Редис број базе података. Подразумевано = 0. Белешка: Не могу користити друге вредности осим 0 са Редис кластером."
 supplementary_cache_options_redis_host: "Редис вредност хоста. Подразумевано = localhost."
 supplementary_cache_options_redis_port: "Редис вредност порта. Подразумевано = „6379“."
 supplementary_cache_options_redis_timeout: "Редис вредност временског ограничења. Подразумевано = „2.5“."
 urlscanner: "Конфигурација за скенер УРЛ-ова."
 urlscanner_cache_time: "Колико дуго (у секундама) треба да се кеширају резултати API претрага? Подразумевано је 3600 секунди (1 сат)."
 urlscanner_google_api_key: "Омогућава API претраге за Google Safe Browsing API када је дефинисан потребан API кључ."
 urlscanner_maximum_api_lookups: "Максимално дозвољени број АПИ претрага које се могу извршити по појединачној итерацији скенирања. Пошто ће свака додатна АПИ претрага повећати укупно време потребно за завршетак сваке итерације скенирања, можда ћете желети да одредите ограничење како бисте убрзали целокупни процес скенирања. Када је подешено на 0, неће се примењивати такав максимални дозвољени број. Подразумевано подешено на 10."
 urlscanner_maximum_api_lookups_response: "Шта урадити ако је прекорачен максимални дозвољени број АПИ претрага? Лажно = Не ради ништа (настави са обрадом) [Подразумевано]; Истинито = Означи/блокирај датотеку."
 virustotal: "Конфигурација за интеграцију Virus Total."
 virustotal_vt_public_api_key: "Опционо, пхпМуссел може да скенира датотеке користећи Virus Total АПИ као начин да обезбеди знатно побољшани ниво заштите од вируса, тројанаца, злонамерног софтвера и других претњи. Стандардно, скенирање датотека помоћу Virus Total АПИ-ја је онемогућено. Да бисте га омогућили, потребан је АПИ кључ од Virus Total-а. Због значајне користи коју би вам ово могло пружити, топло препоручујем да га омогућите. Међутим, имајте на уму да за коришћење Virus Total АПИ-ја, <strong><em>МОРАТЕ</em></strong> да се сложите са њиховим условима коришћења услуге и <strong><em>МОРАТЕ</em></strong> да се придржавате свих смерница описаних у документацији Virus Total-а! НИЈЕ вам дозвољено да користите ову функцију интеграције ОСИМ АКО: Прочитали сте и слажете се са условима коришћења услуге Virus Total и његовог АПИ-ја. Прочитали сте и разумете, као минимум, увод у документацију за јавни АПИ за Virus Total (све после „VirusTotal Public API v2.0“ али пре „Contents“)."
 virustotal_vt_quota_rate: "Према документацији Virus Total АПИ-ја, „ограничено је на највише 4 захтева било које природе у било ком датом временском оквиру од 1 минута. Ако покрећете медени пот, медени клијент или било коју другу аутоматизацију која ће обезбедити ресурсе VirusTotal-у, а не само преузимати извештаје, имате право на већу квоту стопе захтева“. Стандардно, пхпМуссел ће се строго придржавати ових ограничења, али због могућности повећања ових квота, ове две директиве су дате као средство да наложите phpMussel-у ког ограничења треба да се придржава. Препоручује се да повећате ове вредности <strong><em>САМО</em></strong> ако вам је то наложено, Али ако сте наишли на проблеме у вези са достизањем ваше квоте, смањење ових вредности <strong><em>ПОНЕКАД МОЖЕ</em></strong> помоћи код тих проблема. Ваше ограничење се одређује као <code>vt_quota_rate</code> захтева било које природе у било ком датом временском оквиру од <code>vt_quota_time</code> минута."
 virustotal_vt_quota_time: "(Погледајте опис изнад)."
 virustotal_vt_suspicion_level: "Стандардно, пхпМуссел ће ограничити датотеке које скенира помоћу Virus Total АПИ-ја на оне датотеке које сматра „сумњивим“. Ово ограничење можете опционо подесити променом вредности директиве <code>vt_suspicion_level</code>."
 virustotal_vt_weighting: "пхпМуссел треба да примени резултате скенирања Virus Total API-ја као детекције или као тежину детекције? Ова директива постоји зато што, иако би скенирање датотеке помоћу више мотора (као што то ради Virus Total) требало да резултира повећаном стопом детекције (и самим тим већим бројем злонамерних датотека које се откривају), оно такође може резултирати већим бројем лажно позитивних, и стога је у неким околностима боље користити резултате скенирања као процену поузданости него као коначан закључак. Ако се користи вредност 0, резултати скенирања помоћу Virus Total API-ја биће примењени као детекције, и стога, ако било који мотор који користи Virus Total означи датотеку која се скенира као злонамерну, phpMussel ће сматрати датотеку злонамерном. Ако се користи било која друга вредност, резултати скенирања Virus Total API-ја биће примењени као тежина детекције, и стога, број мотора које користи Virus Total, а који означавају датотеку која се скенира као злонамерну, служиће као оцена поузданости (или тежина детекције) за то да ли phpMussel треба да сматра датотеку која се скенира злонамерном (коришћена вредност ће представљати минимални резултат поузданости или тежину потребну да би се сматрало злонамерним). Вредност 0 се користи као стандард."
