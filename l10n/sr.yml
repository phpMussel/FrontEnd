hints_xlists:
 Како ово функционише.: "Ако ваш систем дозвољава отпремање само одређених врста датотека, или ако ваш систем експлицитно забрањује одређене врсте датотеке, навођење тих врста датотека у белим листама, црним листама и сивим листама може повећати брзину скенирања тако што ће скрипти омогућити да прескочи одређене врсте датотеке. Формат је CSV (вредности раздвојене зарезима)."
 Логичан редослед обраде.: "Ако је врста датотека на белој листи, немојте скенирати и не блокирајте датотеку, нити проверавајте датотеку на црној или сивој листи. Ако је врста датотека на црној листи, немојте скенирати датотеку, већ је блокирајте, и не проверавајте датотеку у односу на сиву листу. Ако је сива листа празна или ако сива листа није празна и врста датотека је на сивој листи, скенирајте датотеку као и обично и утврдите да ли је блокирати на основу резултата скенирања, али ако сива листа није празна и врста датотека није на сивој листи, третирајте датотеку као на црној листи, дакле не скенирајте већ блокирајте."
