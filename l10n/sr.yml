 vt_suspicion_level_all: "Скенирај све датотеке."
 vt_suspicion_level_executable: "Скенирај датотеке са хеуристичком тежином, извршне датотеке, и датотеке које потенцијално садрже извршне податке.\nПримери извршних датотека, и датотека које потенцијално садрже извршне податке укључују Windows PE датотеке, Linux ELF датотеке, Mach-O датотеке, DOCX датотеке, ZIP датотеке, итд."
 vt_suspicion_level_heuristic_only: "Скенирај само датотеке са хеуристичком тежином.\nДатотеке ће бити скениране само ако имају одређену хеуристичку тежину. Хеуристичка тежина може се добити из потписа који траже уобичајене отиске прстију повезане са потенцијалном инфекцијом, али који не гарантују нужно инфекцију. У таквим случајевима, може послужити као друго мишљење за резултате који оправдавају сумњу, али иначе не пружају никакву сигурност."
hints_logging_datetime: "Користан савет: Можете да приложите информације о датуму/времену именима датотека евиденције користећи чуваре места у формату времена. Доступни чувари места формата времена су приказани на {{Links.ConfigRef.time_format}}."
