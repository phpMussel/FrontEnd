hints_time_format: |
 <strong><em>Čuvar mjesta – Objašnjenje – Primjer zasnovan na 2024-04-30T18:27:49+08:00.</em></strong><br />
 <code class="s">{yyyy}</code> – Godina – Npr., 2024.<br />
 <code class="s">{yy}</code> – Skraćena godina – Npr., 24.<br />
 <code class="s">{Mon}</code> – Skraćeni naziv mjeseca (na engleskom) – Npr., Apr.<br />
 <code class="s">{mm}</code> – Mjesec sa vodećim nulama – Npr., 04.<br />
 <code class="s">{m}</code> – Mjesec – Npr., 4.<br />
 <code class="s">{Day}</code> – Skraćeni naziv dana (na engleskom) – Npr., Tue.<br />
 <code class="s">{dd}</code> – Dan sa vodećim nulama – Npr., 30.<br />
 <code class="s">{d}</code> – Dan – Npr., 30.<br />
 <code class="s">{hh}</code> – Sat sa vodećim nulama (koristi 24-satno vrijeme) – Npr., 18.<br />
 <code class="s">{h}</code> – Sat (koristi 24-satno vrijeme) – Npr., 18.<br />
 <code class="s">{ii}</code> – Minuta sa vodećim nulama – Npr., 27.<br />
 <code class="s">{i}</code> – Minuta – Npr., 27.<br />
 <code class="s">{ss}</code> – Sekunde sa vodećim nulama – Npr., 49.<br />
 <code class="s">{s}</code> – Sekunde – Npr., 49.<br />
 <code class="s">{tz}</code> – Vremenska zona (bez dvotočke) – Npr., +0800.<br />
 <code class="s">{t:z}</code> – Vremenska zona (sa dvotočkom) – Npr., +08:00.
hints_xlists:
 Kako ovo funkcioniše.: "Ako vaš sistem dozvoljava otpremanje samo određenih vrsta datoteka, ili ako vaš sistem eksplicitno zabranjuje određene vrste datoteka, navođenje tih vrsta datoteka u bijelim, crnim i sivim listama može povećati brzinu skeniranja tako što će skripti omogućiti da preskoči određene vrste datoteka. Format je CSV (vrijednosti odvojene zarezima)."
 Logički redoslijed obrade.: "Ako je vrsta datoteka na bijeloj listi, nemojte skenirati i nemojte blokirati datoteku, niti provjeravati datoteku na crnoj ili sivoj listi. Ako je vrsta datoteka na crnoj listi, nemojte skenirati datoteku, ali je blokirajte, i nemojte provjeravati datoteku na sivoj listi. Ako je siva lista prazna ili ako siva lista nije prazna i vrsta datoteka je na sivoj listi, skenirajte datoteku kao i obično i odredite da li je blokirati na osnovu rezultata skeniranja, ali ako siva lista nije prazna i vrsta datoteka nije na sivoj listi, tretiraj datoteku kao na crnoj listi, dakle ne skeniraj to je već blokiraj to."
