checkbox:
 Delete orphaned values: "Izbrišite izgubljene vrijednosti."
config:
 core: "Opća konfiguracija (svaka konfiguracija jezgra koja ne pripada drugim kategorijama)."
 core_default_timeout: "Zadano vremensko ograničenje za korištenje za vanjske zahtjeve? Zadano = 12 sekundi."
 core_delete_on_sight: "Omogućavanje ove direktive će uputiti skriptu da odmah pokuša da izbriše svaki skenirani pokušaj prijenosa datoteka koji odgovara bilo kom kriterijumu detekcije, bilo putem potpisa ili na neki drugi način. Datoteke označeni kao "čisti" se neće dirati. U slučaju arhiva, cijela arhiva će biti izbrisana, bez obzira na to da li je uvredljivi datoteka samo jedan od nekoliko datoteka koji se nalaze u arhivi. U slučaju skeniranja prijenosa datoteka, obično nije potrebno omogućiti ovu direktivu, jer obično PHP automatski čisti sadržaj svoje keš memorije kada se izvršavanje završi, što znači da će obično izbrisati sve datoteke koje su postavljene preko njega na server osim ako već nisu premještene, kopirane ili izbrisane. Ova direktiva je ovde dodata kao dodatna mera bezbednosti za one čije se kopije PHP-a možda ne ponašaju uvek na očekivani način. False/Lažno = Nakon skeniranja, ostavite datoteku na miru [Zadano]; True/Istinito = Nakon skeniranja, ako nije čisto, odmah izbrišite."
 core_disabled_channels: "Ovo se može koristiti da spriječi phpMussel da koristi određene kanale prilikom slanja zahtjeva."
 core_error_log: "Datoteka za evidentiranje svih otkrivenih grešaka koje nisu fatalne. Navedite naziv datoteke ili ostavite prazno da biste onemogućili."
 core_hide_version: "Sakriti informacije o verziji iz dnevnika i izlaza stranice? True/Istinito = Da; False/Lažno = Ne [Zadano]."
 core_ipaddr: "Gdje pronaći IP adresu zahtjeva za povezivanje? (Korisno za usluge kao što je Cloudflare). Zadano = REMOTE_ADDR. UPOZORENJE: Promijenite ovo samo ako znate šta radite!"
 core_lang: "Odredite podrazumevani jezik za phpMussel."
 core_lang_override: "Lokalizirati prema HTTP_ACCEPT_LANGUAGE kad god je to moguće? True/Istinito = Da [Zadano]; False/Lažno = Ne."
 core_log_rotation_action: "Rotacija dnevnika ograničava broj datoteka dnevnika koji bi trebali postojati u bilo kojem trenutku. Kada se kreiraju nove datoteke evidencije, ako ukupan broj datoteka dnevnika premašuje navedeno ograničenje, navedena radnja će se izvršiti. Ovdje možete odrediti željenu akciju."
 core_log_rotation_limit: "Rotacija dnevnika ograničava broj datoteka dnevnika koji bi trebali postojati u bilo kojem trenutku. Kada se kreiraju nove datoteke evidencije, ako ukupan broj datoteka dnevnika premašuje navedeno ograničenje, navedena radnja će se izvršiti. Ovdje možete odrediti željeni limit. Vrijednost 0 će onemogućiti rotaciju dnevnika."
 core_maintenance_mode: "Omogućiti način održavanja? True/Istinito = Da; False/Lažno = Ne [Zadano]. Onemogućuje sve osim front-enda. Ponekad korisno za ažuriranje vašeg CMS-a, okvira, itd."
 core_outbound_request_log: "Datoteka za evidentiranje rezultata svih odlaznih zahtjeva. Navedite naziv datoteke ili ostavite prazno da biste onemogućili."
 core_request_proxy: "Ako želite da se odlazni zahtjevi šalju putem proxyja, ovdje navedite taj proxy. Ako ne, ostavite ovo prazno."
 core_request_proxyauth: "Ako šaljete odlazne zahtjeve putem proxyja i ako taj proxy zahtijeva korisničko ime i lozinku, ovdje navedite to korisničko ime i lozinku (npr., <code>user:pass</code>). Ako ne, ostavite ovo prazno."
 core_scan_cache_expiry: "Koliko dugo phpMussel treba da kešira rezultate skeniranja? Vrijednost je broj sekundi za keširanje rezultata skeniranja. Podrazumevano je 21600 sekundi (6 sati); Vrijednost 0 će onemogućiti keširanje rezultata skeniranja."
 core_scan_log: "Ime datoteke u koju se evidentiraju svi rezultati skeniranja. Navedite naziv datoteke ili ostavite prazno da biste onemogućili."
 core_scan_log_serialized: "Ime datoteke u koju se evidentiraju svi rezultati skeniranja (koristeći serijalizirani format). Navedite naziv datoteke ili ostavite prazno da biste onemogućili."
 core_statistics: "Pratite statistiku upotrebe phpMussel? True/Istinito = Da; False/Lažno = Ne [Zadano]."
 core_time_format: "Format notacije datuma/vremena koji koristi phpMussel. Dodatne opcije se mogu dodati na zahtjev."
 core_time_offset: "Pomak vremenske zone u minutama."
 core_timezone: "Vremenska zona koju treba koristiti (npr., Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, etc). Odredite "SYSTEM" da dozvolite PHP-u da to automatski obavi umjesto vas."
 core_truncate: "Skratiti datoteke dnevnika kada dostignu određenu veličinu? Vrijednost je maksimalna veličina u B/KB/MB/GB/TB do koje datoteka evidencije može narasti prije nego što bude skraćena. Zadana vrijednost od 0KB onemogućuje skraćivanje (datoteke evidencije mogu beskonačno rasti). Bilješka: Odnosi se na pojedinačne log datoteke! Veličina log datoteka se ne razmatra zajedno."
 experimental: "Nestabilno/Eksperimentalno!"
 files: "Kako rukovati datotekama prilikom skeniranja."
 files_allow_leading_trailing_dots: "Dozvoliti vodeće i zadnje tačke u nazivima datoteka? Ovo se ponekad može koristiti za sakrivanje datoteka ili za prevariti neke sisteme da dozvole prelazak preko direktorija. False/Lažno = Ne dozvoli [Zadano]. True/Istinito = Dozvoli."
 files_archive_file_extensions: "Prepoznate ekstenzije arhivskih datoteka (format je CSV; treba dodati ili ukloniti samo kada se pojave problemi; nepotrebno uklanjanje može uzrokovati pojavu lažnih rezultata za arhivske datoteke, dok će nepotrebni dodaci u suštini staviti na bijelu listu ono što dodajete iz detekcije specifičnog za napad; modificirajte s oprezom; također imajte na umu da ovo nema utjecaja na to koje arhive mogu, a koje ne mogu biti analizirane na nivou sadržaja). Lista, kao što je podrazumevano, navodi one formate koji se najčešće koriste u većini sistema i CMS-a, ali namerno nije nužno sveobuhvatna."
 files_block_control_characters: "Blokirati sve datoteke koje sadrže bilo koje kontrolne znakove (osim novih redova)? Ako otpremate <strong><em>SAMO</em></strong> običan tekst, onda omogućavanje ove opcije može pružiti dodatnu zaštitu vašem sistemu. Međutim, ako otpremate bilo što osim običnog teksta, omogućavanje ove opcije može dovesti do lažnih pozitivnih rezultata. False/Lažno = Ne blokiraj [Zadano]; True/Istinito = Blokiraj."
 files_block_encrypted_archives: "Otkriti i blokirati šifrirane arhive? Budući da phpMussel nije u stanju da skenira sadržaj šifrovanih arhiva, moguće je da napadač koristi šifrovanje arhive kao način pokušaja da zaobiđe phpMussel, antivirusne skenere i druge takve zaštite. Upućivanje phpMusselu da blokira sve arhive za koje otkrije da su šifrirane moglo bi potencijalno pomoći u smanjenju takvog rizika. False/Lažno = Ne; True/Istinito = Da [Zadano]."
 files_block_macros: "Pokušati blokirati sve datoteke koje sadrže makroe? Neke vrste dokumenata i tabela mogu sadržavati izvršne makroe, što predstavlja opasan potencijalni vektor zlonamjernog softvera. False/Lažno = Ne blokiraj [Zadano]; True/Istinito = Blokiraj."
 files_can_contain_php_file_extensions: "Lista ekstenzija datoteka kojima je dozvoljeno da sadrže PHP kod, odvojenih zarezima. Ako je detekcija PHP kameleonskog napada omogućena, datoteke koje sadrže PHP kod, koje imaju ekstenzije koje nisu na ovoj listi, biće otkrivene kao PHP kameleon napadi."
 files_chameleon_from_exe: "Potražite zaglavlja izvršnih datoteka u datotekama koje nisu ni izvršne ni priznate arhive i izvršne datoteke čija su zaglavlja netačna. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_from_php: "Potražite PHP zaglavlja u datotekama koje nisu ni PHP datoteke ni priznate arhive. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_archive: "Otkrivanje neispravnih zaglavlja u arhivama i komprimiranim datotekama. Podržano: BZ/BZIP2, GZ/GZIP, LZF, RAR, ZIP. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_doc: "Potražite office dokumente čija su zaglavlja netačna (Podržano: DOC, DOT, PPS, PPT, XLA, XLS, WIZ). False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_img: "Potražite slike čija su zaglavlja netačna (Podržano: BMP, DIB, PNG, GIF, JPEG, JPG, XCF, PSD, PDD, WEBP). False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_pdf: "Potražite PDF datoteke čija su zaglavlja netačna. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_check_archives: "Pokušati provjeriti sadržaj arhive? False/Lažno = Ne provjeravajte; True/Istinito = Provjerite [Zadano]. Podržano: Zip (zahtijeva libzip), Tar, Rar (zahtijeva rar ekstenziju)."
 files_corrupted_exe: "Oštećeni datoteke i greške raščlanjivanje. False/Lažno = Zanemari; True/Istinito = Blokiraj [Zadano]. Otkriti i blokirati potencijalno oštećene PE (Portable Executable) datoteke? Često (ali ne uvijek), kada su određeni aspekti PE datoteke oštećeni ili se ne mogu pravilno raščlaniti, to može ukazivati ​​na virusnu infekciju. Ako je programer virusa svjestan kako antivirusni program analizira PE datoteke, može pokušati posebno to spriječiti, kako bi omogućio da njihov virus ostane neotkriven."
 files_decode_threshold: "Maksimalna dužina neobrađenih podataka na kojoj treba detektovati komande za dekodiranje (u slučaju da postoje primetni problemi sa performansama tokom skeniranja). Zadano = 512KB. Nula uklanja svako takvo ograničenje na osnovu veličine datoteke."
 files_entropy_filesize_limit: "Ograničenje veličine datoteke entropije za potpise koji koriste normalizirane podatke (zadana vrijednost je 256KB). Kada se prekorači i granica entropije i ograničenje veličine datoteke entropije, kako bi se smanjio rizik od lažnih pozitivnih rezultata, neki potpisi koji koriste normalizirane podatke će biti zanemareni."
 files_entropy_limit: "Ograničenje entropije za potpise koji koriste normalizirane podatke (zadana vrijednost je 7.7). U ovom kontekstu, entropija je definirana kao šenonova entropija sadržaja datoteke koja se skenira. Kada se prekorači i ograničenje entropije i ograničenje veličine datoteke entropije, kako bi se smanjio rizik od lažnih pozitivnih rezultata, neki potpisi koji koriste normalizirane podatke će biti zanemareni."
 files_filesize_archives: "Primijeniti crnu/bijelu listu veličine datoteka na sadržaj arhiva? False/Lažno = Ne (stavite na sivu listu); True/Istinito = Da [Zadano]."
 files_filesize_limit: "Ograničenje veličine datoteke u KB. 65536 = 64MB [Zadano]; 0 = Nema ograničenja (uvijek na sivoj listi). Bilo koja (pozitivna) numerička vrijednost je prihvaćena. Ovo može biti korisno kada vaša PHP konfiguracija ograničava količinu memorije koju proces može zadržati ili ako vaša PHP konfiguracija ograničava veličinu datoteka za otpremanje."
 files_filesize_response: "Šta učiniti s datotekama koje premašuju ograničenje veličine datoteke (ako ograničenje postoji). False/Lažno = Stavite na bijelu listu; True/Istinito = Stavite na crnu listu [Zadano]."
 files_filetype_archives: "Primijeniti crnu/bijelu listu vrsta datoteka na sadržaj arhiva? False/Lažno = Ne (stavite na sivu listu) [Zadano]; True/Istinito = Da."
 files_filetype_blacklist: "Crna lista:"
 files_filetype_greylist: "Siva lista:"
 files_filetype_whitelist: "Bijela lista:"
 files_max_files_in_archives: "Maksimalan broj datoteka za skeniranje iz arhiva prije prekida skeniranja. Zadano = 0 (bez maksimuma)."
 files_max_recursion: "Maksimalno ograničenje dubine rekurzije za arhive. Zadano = 3."
 files_only_allow_images: "Kada je postavljeno na "true", sve datoteke koje skener pronađe, a nisu slike, bit će odmah označene, bez skeniranja. Ovo može pomoći u smanjenju vremena potrebnog za dovršetak skeniranja u nekim slučajevima. Podrazumevano postavljeno na "false"."
 files_scannable_threshold: "Prag za dužinu sirovih podataka koje phpMussel smije čitati i skenirati (u slučaju da postoje bilo kakvi primjetni problemi s performansama tokom skeniranja). Zadano = 32MB. Vrijednost nula onemogućava prag. Generalno, ova vrijednost ne bi trebala biti manja od prosječne veličine datoteka koje želite i očekujete da primite na svoj server ili web stranicu, ne bi trebalo biti veće od direktive filesize_limit, i ne bi trebalo biti više od otprilike jedne petine ukupne dozvoljene alokacije memorije dodijeljene PHP-u putem konfiguracijske datoteke "php.ini". Ova direktiva postoji kako bi se spriječilo da phpMussel koristi previše memorije (što bi ga spriječilo da uspješno skenira datoteke veće od određene veličine)."
 frontend: "Konfiguracija za front-end."
 frontend_custom_footer: "Umetnuto kao HTML na samom dnu svih front-end stranica. Ovo bi moglo biti korisno u slučaju da na svim takvim stranicama želite uključiti pravnu obavijest, vezu za kontakt, poslovne informacije, ili slično."
 frontend_custom_header: "Umetnuto kao HTML na samom početku svih front-end stranica. Ovo bi moglo biti korisno u slučaju da na svim takvim stranicama želite uključiti logo web stranice, personalizirano zaglavlje, skripte, ili slično."
 frontend_default_algo: "Definira koji algoritam koristiti za sve buduće lozinke i sesije."
 frontend_frontend_log: "Datoteka za evidentiranje pokušaja front-end prijave. Navedite naziv datoteke ili ostavite prazno da biste onemogućili."
 frontend_magnification: "Uvećanje fonta. Zadano = 1."
 frontend_max_login_attempts: "Maksimalan broj front-end pokušaja prijave. Zadano = 5."
 frontend_numbers: "Kako želite da se brojevi prikazuju? Odaberite primjer koji vam se čini najispravnijim."
 frontend_theme: "Tema koja će se koristiti za front-end."
 frontend_theme_mode: "Način za tema koja će se koristiti za front-end."
 legal: "Konfiguracija za zakonske zahtjeve."
 legal_privacy_policy: "Adresa relevantne politike privatnosti koja će se prikazati u podnožju svake generisane stranice. Navedite URL, ili ostavite prazno da biste onemogućili."
 legal_pseudonymise_ip_addresses: "Pseudonimizirati IP adrese prilikom prijavljivanja? True/Istinito = Da [Zadano]; False/Lažno = Ne."
 quarantine: "Konfiguracija za karantin."
 quarantine_quarantine_key: "phpMussel može staviti blokirane prijenose datoteka u karantin, ako to želite. Povremeni korisnici phpMussel-a koji samo žele zaštititi svoje web stranice ili hosting okruženje, bez ikakvog interesa za dubinsku analizu bilo kakvih označenih pokušaja otpremanja datoteka, trebali bi ostaviti ovu funkcionalnost onemogućenom, ali svi korisnici zainteresirani za daljnju analizu označenih pokušaja otpremanja datoteka za istraživanje zlonamjernog softvera ili slične stvari trebali bi omogućiti ovu funkcionalnost. Funkcionalnost karantina ponekad može pomoći i u otklanjanju grešaka u lažno pozitivnim rezultatima, ako vam se to često dešava. Da biste onemogućili funkcionalnost karantina, jednostavno ostavite direktivu <code>quarantine_key</code> praznu, ili je ispraznite ako već nije prazna. Da biste omogućili funkcionalnost karantina, unesite neku vrijednost u direktivu. <code>quarantine_key</code> je važna sigurnosna karakteristika funkcionalnosti karantina potrebna kao sredstvo za sprečavanje iskorištavanja funkcionalnosti karantina od strane potencijalnih napadača i kao sredstvo za sprečavanje bilo kakvog potencijalnog izvršavanja podataka pohranjenih unutar karantina. <code>quarantine_key</code> treba tretirati na isti način kao i vaše lozinke: što duže to bolje, i strogo ga čuvajte. Za najbolji efekat, koristite u kombinaciji sa <code>delete_on_sight</code>."
 quarantine_quarantine_max_files: "Maksimalan broj datoteka koje mogu postojati u karantinu. Kada se nove datoteke dodaju u karantin, ako se ovaj broj premaši, stare datoteke će biti izbrisane kako bi se broj sveo ispod ovog maksimuma. Zadano = 100."
 quarantine_quarantine_max_filesize: "Maksimalna dozvoljena veličina datoteke za stavljanje datoteka u karantin. Datoteke veće od navedene vrijednosti NEĆE biti stavljene u karantin. Ova direktiva je važna jer otežava potencijalnim napadačima da preplave vaš karantin neželjenim podacima, što bi potencijalno moglo uzrokovati prekomjerno korištenje podataka na vašoj usluzi hostinga. Zadano = 2MB."
 quarantine_quarantine_max_usage: "Maksimalna dozvoljena upotreba memorije za karantin. Ako ukupna memorija koju koristi karantin dostigne ovu vrijednost, najstarije datoteke u karantinu bit će izbrisane kako bi se ukupna korištena memorija svela ispod ove vrijednosti. Ova direktiva je važna jer otežava potencijalnim napadačima da preplave vaš karantin neželjenim podacima, što bi potencijalno moglo uzrokovati prekomjerno korištenje podataka na vašoj usluzi hostinga. Zadano = 64MB."
 signatures: "Konfiguracija za potpise, datoteke potpisa, itd."
 signatures_active: "Spisak aktivnih datoteka potpisa, odvojenih zarezima. Bilješka: Datoteke potpisa prvo moraju biti instalirane, prije nego što ih možete aktivirati. Da bi testne datoteke ispravno radile, datoteke potpisa moraju biti instalirane i aktivirane."
 signatures_detect_adware: "Treba li phpMussel koristiti potpise za otkrivanje adwarea? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_deface: "Treba li phpMussel koristiti potpise za otkrivanje oštećenja web stranice? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_encryption: "Treba li phpMussel otkriti i blokirati šifrirane datoteke? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_joke_hoax: "Treba li phpMussel koristiti potpise za otkrivanje zlonamjernog softvera i virusa sa šalama/prevarama? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_packer_packed: "Treba li phpMussel koristiti potpise za otkrivanje packer-ova i pakovanih podataka? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_pua_pup: "Treba li phpMussel koristiti potpise za otkrivanje potencijalno neželjenih aplikacija (PUA/PUP)? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_shell: "Treba li phpMussel koristiti potpise za otkrivanje shell skripti? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_fail_extensions_silently: "Treba li phpMussel prijaviti kada nedostaju ekstenzije? Ako je <code>fail_extensions_silently</code> onemogućen, nedostajuće ekstenzije će biti prijavljene prilikom skeniranja, a ako je <code>fail_extensions_silently</code> omogućen, nedostajuće ekstenzije će biti ignorisane, a skeniranje će izvještavati o onima datotekama za koje nema problema. Onemogućavanje ove direktive može potencijalno povećati vašu sigurnost, ali može dovesti i do povećanja lažno pozitivnih. False/Lažno = Onemogućeno; True/Istinito = Omogućeno [Zadano]."
 signatures_fail_silently: "Treba li phpMussel prijaviti kada datoteke potpisa nedostaju ili su oštećene? Ako je <code>fail_silently</code> onemogućen, nedostajuće i oštećene datoteke će biti prijavljene prilikom skeniranja, a ako je <code>fail_silently</code> omogućen, nedostajuće i oštećene datoteke će biti ignorisane, a skeniranje će izvještavati o onima datotekama za koje nema problema. Ovo treba promijeniti samo ako imate problema poput pada sistema ili slično. False/Lažno = Onemogućeno; True/Istinito = Omogućeno [Zadano]."
 signatures_heuristic_threshold: "Neki phpMussel potpisi su namijenjeni identifikaciji datoteka koje bi mogle biti sumnjive, bez direktnog identificiranja tih datoteka kao zlonamjernih. Ova vrijednost označava maksimalnu dozvoljenu težinu prije nego što phpMussel označi te datoteke kao zlonamjerne. Definicija težine u ovom kontekstu je ukupan broj identifikovanih sumnjivih i potencijalno zlonamjernih indikatora. Podrazumevano, ova vrijednost će biti postavljena na 3. Niža vrijednost će uglavnom rezultirati većom pojavom lažno pozitivnih, ali i većim brojem označenih zlonamjernih datoteka, dok će viša vrijednost uglavnom rezultirati manjom pojavom lažno pozitivnih, ali i manjim brojem označenih zlonamjernih datoteka. Najbolje je promijeniti ovu vrijednost samo ako imate problema."
 supplementary_cache_options: "Dodatne opcije keša. Bilješka: Promjena ovih vrijednosti može vas potencijalno odjaviti."
