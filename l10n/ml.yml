 virustotal_vt_public_api_key: "നിങ്ങൾക്ക് വേണമെങ്കിൽ, വൈറസുകൾ, ട്രോജനുകൾ, മാൽവെയർ, മറ്റ് ഭീഷണികൾ എന്നിവയ്‌ക്കെതിരെ വളരെയധികം മെച്ചപ്പെടുത്തിയ പരിരക്ഷ നൽകുന്നതിന് phpMussel-ന് Virus Total API ഉപയോഗിച്ച് ഫയലുകൾ സ്കാൻ ചെയ്യാൻ കഴിയും. സ്ഥിരസ്ഥിതിയായി, Virus Total API ഉപയോഗിച്ച് ഫയലുകൾ സ്കാൻ ചെയ്യുന്നത് പ്രവർത്തനരഹിതമാക്കിയിരിക്കുന്നു. ഇത് പ്രാപ്തമാക്കാൻ, Virus Total-ൽ നിന്നുള്ള ഒരു API കീ ആവശ്യമാണ്. ഇത് നിങ്ങൾക്ക് നൽകുന്ന ശക്തമായ നേട്ടം കാരണം ഇത് പ്രവർത്തനക്ഷമമാക്കാൻ ഞാൻ വളരെ ശുപാർശ ചെയ്യുന്നു. Virus Total API ഉപയോഗിക്കുന്നതിന്, നിങ്ങൾ അവരുടെ സേവന നിബന്ധനകൾ അംഗീകരിക്കുകയും അവരുടെ ഡോക്യുമെന്റേഷനിൽ വിവരിച്ചിരിക്കുന്ന എല്ലാ മാർഗ്ഗനിർദ്ദേശങ്ങളും പാലിക്കുകയും ചെയ്യണമെന്ന് ദയവായി അറിഞ്ഞിരിക്കുക! Virus Total പബ്ലിക് API ഡോക്യുമെന്റേഷന്റെ ആമുഖം നിങ്ങൾ വായിക്കുകയും മനസ്സിലാക്കുകയും വേണം ("VirusTotal Public API v2.0" ന് ശേഷമുള്ളതും "Contents" എന്നതിന് മുമ്പുള്ളതുമായ എല്ലാം)."
 virustotal_vt_quota_rate: "Virus Total API ഡോക്യുമെന്റേഷൻ അനുസരിച്ച്, ഒരു മിനിറ്റ് സമയപരിധിക്കുള്ളിൽ ഏത് തരത്തിലുള്ള അഭ്യർത്ഥനകൾക്കും പരമാവധി 4 എണ്ണം മാത്രമേ അനുവദിക്കൂ. Virus Total-ന് ഉറവിടങ്ങൾ നൽകുന്നതും റിപ്പോർട്ടുകൾ വീണ്ടെടുക്കുന്നതുമായ ഒരു ഹണിക്ലയന്റ്, ഹണിപോട്ട്, അല്ലെങ്കിൽ മറ്റേതെങ്കിലും ഓട്ടോമേഷൻ നിങ്ങൾ പ്രവർത്തിപ്പിക്കുകയാണെങ്കിൽ, ഉയർന്ന അഭ്യർത്ഥന നിരക്ക് ക്വാട്ടയ്ക്ക് നിങ്ങൾക്ക് അർഹതയുണ്ട്. സ്ഥിരസ്ഥിതിയായി, phpMussel ഈ പരിമിതികൾ കർശനമായി പാലിക്കും, എന്നാൽ ഈ നിരക്ക് ക്വാട്ടകൾ വർദ്ധിപ്പിക്കാനുള്ള സാധ്യത കാരണം, phpMussel ഏതൊക്കെ പരിധികൾ പാലിക്കണമെന്ന് നിർദ്ദേശിക്കുന്നതിനാണ് ഈ രണ്ട് നിർദ്ദേശങ്ങളും നൽകിയിരിക്കുന്നത്. നിങ്ങൾക്ക് നിർദ്ദേശം ലഭിച്ചിട്ടുണ്ടെങ്കിൽ മാത്രമേ ഈ മൂല്യങ്ങൾ വർദ്ധിപ്പിക്കാവൂ, എന്നാൽ നിങ്ങളുടെ നിരക്ക് ക്വാട്ടയുമായി ബന്ധപ്പെട്ട് പ്രശ്നങ്ങൾ നേരിട്ടിട്ടുണ്ടെങ്കിൽ, ഈ മൂല്യങ്ങൾ കുറയ്ക്കുന്നത് ചിലപ്പോൾ സഹായിച്ചേക്കാം. നിങ്ങളുടെ നിരക്ക് പരിധി ഏതെങ്കിലും <code>vt_quota_time</code> മിനിറ്റ് സമയപരിധിക്കുള്ളിൽ ഏതെങ്കിലും തരത്തിലുള്ള <code>vt_quota_rate</code> അഭ്യർത്ഥനകളായി നിർണ്ണയിക്കപ്പെടുന്നു."
 virustotal_vt_quota_time: "(മുകളിലുള്ള വിവരണം കാണുക)."
 virustotal_vt_suspicion_level: "ഡിഫോൾട്ടായി, phpMussel സംശയാസ്പദമായി കരുതുന്ന ഫയലുകൾ മാത്രമേ Virus Total API ഉപയോഗിച്ച് സ്കാൻ ചെയ്യുകയുള്ളൂ. <code>vt_suspicion_level</code> നിർദ്ദേശത്തിന്റെ മൂല്യം മാറ്റിക്കൊണ്ട് നിങ്ങൾക്ക് ഈ നിയന്ത്രണം ഓപ്ഷണലായി ക്രമീകരിക്കാൻ കഴിയും."
 virustotal_vt_weighting: "Virus Total API സ്കാൻ ഫലങ്ങൾ കണ്ടെത്തലുകൾ ആയിട്ടാണോ അതോ ഭാരം ആയിട്ടാണോ ഉപയോഗിക്കേണ്ടത്? ഒന്നിലധികം എഞ്ചിനുകൾ ഉപയോഗിച്ച് ഒരു ഫയൽ സ്കാൻ ചെയ്യുന്നത് (Virus Total ചെയ്യുന്നതുപോലെ) കണ്ടെത്തൽ നിരക്ക് വർദ്ധിപ്പിക്കുന്നതിലേക്ക് നയിക്കണം (അതിനാൽ കൂടുതൽ ക്ഷുദ്ര ഫയലുകൾ പിടിക്കപ്പെടുന്നതിനും കാരണമാകുന്നു), പക്ഷേ ഇത് കൂടുതൽ തെറ്റായ പോസിറ്റീവുകൾക്കും കാരണമാകും, അതിനാൽ, ചില സാഹചര്യങ്ങളിൽ, സ്കാൻ ഫലങ്ങൾ ഒരു അന്തിമ നിഗമനമായി ഉപയോഗിക്കുന്നതിനുപകരം ഒരു ആത്മവിശ്വാസ സ്കോറായി ഉപയോഗിക്കുന്നതാണ് നല്ലത്. 0 എന്ന മൂല്യം ഉപയോഗിച്ചാൽ, Virus Total API സ്കാൻ ഫലങ്ങൾ കണ്ടെത്തലുകളായി പ്രയോഗിക്കും, അതിനാൽ, Virus Total ഉപയോഗിക്കുന്ന ഏതെങ്കിലും എഞ്ചിൻ സ്കാൻ ചെയ്യുന്ന ഫയലിനെ ക്ഷുദ്രകരമായി ഫ്ലാഗ് ചെയ്താൽ, phpMussel ഫയലിനെ ക്ഷുദ്രകരമായി കണക്കാക്കും. മറ്റേതെങ്കിലും മൂല്യം ഉപയോഗിക്കുകയാണെങ്കിൽ, Virus Total API സ്കാൻ ഫലങ്ങൾ ഭാരമായി പ്രയോഗിക്കും, അതിനാൽ, ഫയലിനെ ക്ഷുദ്രകരമായി ഫ്ലാഗ് ചെയ്യുന്ന Virus Total ഉപയോഗിക്കുന്ന എഞ്ചിനുകളുടെ എണ്ണം phpMussel സ്കാൻ ചെയ്യുന്ന ഫയലിനെ ക്ഷുദ്രകരമായി കണക്കാക്കണമോ എന്നതിനുള്ള ആത്മവിശ്വാസ സ്കോറായി വർത്തിക്കും (ഉപയോഗിക്കുന്ന മൂല്യം, ക്ഷുദ്രകരമായി കണക്കാക്കുന്നതിന് ആവശ്യമായ ഏറ്റവും കുറഞ്ഞ ആത്മവിശ്വാസ സ്‌കോറിനെയോ ഭാരത്തെയോ പ്രതിനിധീകരിക്കും). സ്ഥിരസ്ഥിതിയായി 0 എന്ന മൂല്യം ഉപയോഗിക്കുന്നു."
