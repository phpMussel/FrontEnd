 files_max_files_in_archives: "സ്കാൻ നിർത്തുന്നതിന് മുമ്പ് ആർക്കൈവുകളിൽ നിന്ന് സ്കാൻ ചെയ്യേണ്ട പരമാവധി ഫയലുകളുടെ എണ്ണം. സ്ഥിരസ്ഥിതി = 0 (പരമാവധി ഇല്ല)."
 files_max_recursion: "ആർക്കൈവുകൾക്കുള്ള പരമാവധി ആവർത്തന ആഴ പരിധി. സ്ഥിരസ്ഥിതി = 3."
 files_only_allow_images: "True എന്ന് സജ്ജമാക്കുമ്പോൾ, സ്കാനർ കണ്ടെത്തുന്ന ഇമേജുകൾ അല്ലാത്ത ഏതൊരു ഫയലുകളും സ്കാൻ ചെയ്യാതെ തന്നെ ഉടനടി ഫ്ലാഗ് ചെയ്യപ്പെടും. ചില സന്ദർഭങ്ങളിൽ സ്കാൻ പൂർത്തിയാക്കാൻ ആവശ്യമായ സമയം കുറയ്ക്കാൻ ഇത് സഹായിച്ചേക്കാം. സ്ഥിരസ്ഥിതിയായി false സജ്ജമാക്കുക."
 files_scannable_threshold: "phpMussel-ന് വായിക്കാനും സ്കാൻ ചെയ്യാനും അനുവാദമുള്ള പരമാവധി റോ ഡാറ്റയുടെ ദൈർഘ്യം (സ്കാൻ ചെയ്യുമ്പോൾ ശ്രദ്ധേയമായ പ്രകടന പ്രശ്നങ്ങൾ ഉണ്ടായാൽ). സ്ഥിരസ്ഥിതി = 32MB. പൂജ്യം അല്ലെങ്കിൽ ശൂന്യ മൂല്യം പരിധി പ്രവർത്തനരഹിതമാക്കുന്നു. സാധാരണയായി, ഈ മൂല്യം നിങ്ങളുടെ സെർവറിലേക്കോ വെബ്‌സൈറ്റിലേക്കോ ലഭിക്കാൻ ആഗ്രഹിക്കുന്നതും പ്രതീക്ഷിക്കുന്നതുമായ ഫയൽ അപ്‌ലോഡുകളുടെ ശരാശരി ഫയൽ വലുപ്പത്തേക്കാൾ കുറവായിരിക്കരുത്, filesize_limit നിർദ്ദേശത്തേക്കാൾ കൂടുതലാകരുത്, കൂടാതെ "php.ini" കോൺഫിഗറേഷൻ ഫയൽ വഴി PHP-ക്ക് അനുവദിച്ചിട്ടുള്ള ആകെ മെമ്മറി അലോക്കേഷന്റെ ഏകദേശം അഞ്ചിലൊന്നിൽ കൂടുതലാകരുത്. phpMussel വളരെയധികം മെമ്മറി ഉപയോഗിക്കുന്നത് തടയാൻ ശ്രമിക്കുന്നതിനാണ് ഈ നിർദ്ദേശം നിലവിലുള്ളത് (വളരെയധികം മെമ്മറി ഉപയോഗിക്കുന്നത് ഒരു നിശ്ചിത ഫയൽ വലുപ്പത്തിന് മുകളിലുള്ള ഫയലുകൾ വിജയകരമായി സ്കാൻ ചെയ്യുന്നതിന് തടസ്സമായേക്കാം)."
 frontend: "ഫ്രണ്ട്-എൻഡിനായുള്ള കോൺഫിഗറേഷൻ."
 frontend_custom_footer: "എല്ലാ ഫ്രണ്ട്-എൻഡ് പേജുകളുടെയും ഏറ്റവും താഴെയായി HTML ആയി ചേർത്തിരിക്കുന്നു. നിയമപരമായ അറിയിപ്പ്, കോൺടാക്റ്റ് ലിങ്ക്, ബിസിനസ്സ് വിവരങ്ങൾ, അല്ലെങ്കിൽ സമാനമായ എല്ലാ പേജുകളിലും ഉൾപ്പെടുത്താൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന സാഹചര്യത്തിൽ ഇത് ഉപയോഗപ്രദമാകും."
 frontend_custom_header: "എല്ലാ ഫ്രണ്ട്-എൻഡ് പേജുകളുടെയും തുടക്കത്തിൽ തന്നെ HTML ആയി ചേർത്തിരിക്കുന്നു. ഒരു വെബ്‌സൈറ്റ് ലോഗോ, വ്യക്തിഗതമാക്കിയ തലക്കെട്ട്, സ്‌ക്രിപ്റ്റുകൾ, അല്ലെങ്കിൽ സമാനമായ എല്ലാ പേജുകളിലും ഉൾപ്പെടുത്താൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന സാഹചര്യത്തിൽ ഇത് ഉപയോഗപ്രദമാകും."
 frontend_default_algo: "ഭാവിയിലെ എല്ലാ പാസ്‌വേഡുകൾക്കും സെഷനുകൾക്കും ഏത് അൽഗോരിതം ഉപയോഗിക്കണമെന്ന് നിർവചിക്കുന്നു."
 frontend_frontend_log: "ഫ്രണ്ട്-എൻഡ് ലോഗിൻ ശ്രമങ്ങൾ രേഖപ്പെടുത്തുന്നതിനുള്ള ഫയൽ. ഒരു ഫയലിൻ്റെ പേര് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
 frontend_magnification: "ഫോണ്ട് മാഗ്നിഫിക്കേഷൻ. സ്ഥിരസ്ഥിതി = 1."
 frontend_max_login_attempts: "ഫ്രണ്ട്-എൻഡ് ലോഗിൻ ശ്രമങ്ങളുടെ പരമാവധി എണ്ണം. സ്ഥിരസ്ഥിതി = 5."
 frontend_numbers: "അക്കങ്ങൾ എങ്ങനെ പ്രദർശിപ്പിക്കാനാണ് നിങ്ങൾ ഇഷ്ടപ്പെടുന്നത്? നിങ്ങൾക്ക് ഏറ്റവും ശരിയായി തോന്നുന്ന ഉദാഹരണം തിരഞ്ഞെടുക്കുക."
