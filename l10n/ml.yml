hints_xlists:
 ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു.: "നിങ്ങളുടെ സിസ്റ്റം പ്രത്യേക തരം ഫയലുകൾ മാത്രം അപ്‌ലോഡ് ചെയ്യാൻ അനുവദിക്കുകയാണെങ്കിൽ, അല്ലെങ്കിൽ നിങ്ങളുടെ സിസ്റ്റം ചില തരം ഫയലുകൾ വ്യക്തമായി നിരസിക്കുകയാണെങ്കിൽ, വൈറ്റ്‌ലിസ്റ്റുകൾ, ബ്ലാക്ക്‌ലിസ്റ്റുകൾ, ഗ്രേലിസ്റ്റുകൾ എന്നിവയിൽ ആ ഫയൽ തരങ്ങൾ വ്യക്തമാക്കുന്നത് സ്കാനിന്റെ വേഗത വർദ്ധിപ്പിക്കും (കാരണം ചില തരം ഫയലുകൾ പിന്നീട് ഒഴിവാക്കാം). ഫോർമാറ്റ് CSV (കോമയാൽ വേർതിരിച്ച മൂല്യങ്ങൾ) ആണ്."
 പ്രക്രിയയുടെ യുക്തിസഹമായ ക്രമം.: "ഫയൽ തരം വൈറ്റ്‌ലിസ്റ്റിലാണെങ്കിൽ, ഫയൽ സ്കാൻ ചെയ്യുകയോ തടയുകയോ ചെയ്യരുത്, കൂടാതെ ഫയൽ ബ്ലാക്ക്‌ലിസ്റ്റിലോ ഗ്രേലിസ്റ്റിലോ പരിശോധിക്കരുത്. ഫയൽ തരം ബ്ലാക്ക്‌ലിസ്റ്റിലാണെങ്കിൽ, ഫയൽ സ്കാൻ ചെയ്യരുത്, പക്ഷേ എന്തായാലും അത് തടയുക, കൂടാതെ ഗ്രേലിസ്റ്റിൽ ഫയൽ പരിശോധിക്കരുത്. ഗ്രേലിസ്റ്റ് ശൂന്യമല്ലെങ്കിൽ ഫയൽ തരം ഗ്രേലിസ്റ്റിലാണെങ്കിൽ, സാധാരണ രീതിയിൽ ഫയൽ സ്കാൻ ചെയ്ത് സ്കാനിന്റെ ഫലങ്ങളെ അടിസ്ഥാനമാക്കി അത് തടയണോ എന്ന് നിർണ്ണയിക്കുക, എന്നാൽ ഗ്രേലിസ്റ്റ് ശൂന്യമല്ലെങ്കിൽ, ഫയൽ തരം ഗ്രേലിസ്റ്റിൽ ഇല്ലെങ്കിൽ, ഫയൽ ബ്ലാക്ക്‌ലിസ്റ്റിലുള്ളതുപോലെ പരിഗണിക്കുക, അതിനാൽ അത് സ്കാൻ ചെയ്യരുത്, എന്തായാലും അത് തടയുക."
