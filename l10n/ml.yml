 legal: "നിയമപരമായ ആവശ്യകതകൾക്കായുള്ള കോൺഫിഗറേഷൻ."
 legal_privacy_policy: "ജനറേറ്റ് ചെയ്യുന്ന ഏതൊരു പേജിന്റെയും ഫൂട്ടറിൽ പ്രദർശിപ്പിക്കേണ്ട പ്രസക്തമായ സ്വകാര്യതാ നയത്തിന്റെ വിലാസം. ഒരു URL വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
 legal_pseudonymise_ip_addresses: "രേഖപ്പെടുത്തിയിരിക്കുന്ന IP വിലാസങ്ങൾ വ്യാജനാമമാക്കണോ? True = അതെ [സ്ഥിരസ്ഥിതി]; False = ഇല്ല."
 quarantine: "ക്വാറന്റൈനിനുള്ള കോൺഫിഗറേഷൻ."
 quarantine_quarantine_key: "നിങ്ങൾക്ക് വേണമെങ്കിൽ, തടയുക ഫയൽ അപ്‌ലോഡുകൾ phpMussel-ന് ക്വാറന്റൈൻ ചെയ്യാൻ കഴിയും. വെബ്‌സൈറ്റുകളെയോ ഹോസ്റ്റിംഗ് പരിതസ്ഥിതികളെയോ സംരക്ഷിക്കാൻ മാത്രം ആഗ്രഹിക്കുകയും ഫയൽ അപ്‌ലോഡുകൾ ആഴത്തിൽ വിശകലനം ചെയ്യാൻ താൽപ്പര്യമില്ലെങ്കിൽ, ഈ പ്രവർത്തനം പ്രവർത്തനരഹിതമാക്കണം, എന്നാൽ മാൽവെയർ ഗവേഷണത്തിനും മറ്റും വേണ്ടിയുള്ള ഫയൽ അപ്‌ലോഡുകളുടെ കൂടുതൽ വിശകലനത്തിൽ താൽപ്പര്യമുണ്ടെങ്കിൽ, ഈ പ്രവർത്തനം പ്രവർത്തനക്ഷമമാക്കണം. തെറ്റായ പോസിറ്റീവുകൾ ഡീബഗ് ചെയ്യുന്നതിനും ക്വാറന്റൈൻ ചിലപ്പോൾ സഹായിച്ചേക്കാം. ക്വാറന്റൈൻ പ്രവർത്തനം പ്രവർത്തനരഹിതമാക്കാൻ, <code>quarantine_key</code> നിർദ്ദേശം ശൂന്യമായി വിടുക, അല്ലെങ്കിൽ ഇതിനകം ശൂന്യമല്ലെങ്കിൽ ശൂന്യമാക്കുക. ക്വാറന്റൈൻ പ്രവർത്തനം പ്രാപ്തമാക്കാൻ, കുറച്ച് മൂല്യം നൽകുക. ക്വാറന്റൈൻ പ്രവർത്തനത്തിന് <code>quarantine_key</code> ഒരു പ്രധാന സുരക്ഷാ സവിശേഷതയാണ്, കാരണം സംഭരിച്ചിരിക്കുന്ന ഡാറ്റ നടപ്പിലാക്കാൻ ആഗ്രഹിക്കുന്ന സാധ്യതയുള്ള ആക്രമണകാരികളുടെ ചൂഷണം തടയാൻ ഇത് സഹായിക്കുന്നു. <code>quarantine_key</code> നിങ്ങളുടെ പാസ്‌വേഡുകളുടെ അതേ രീതിയിൽ തന്നെ പരിഗണിക്കണം: ദൈർഘ്യമേറിയതാണ് നല്ലത്, അത് കർശനമായി സൂക്ഷിക്കുക. മികച്ച ഫലത്തിനായി, <code>delete_on_sight</code>-നൊപ്പം ഉപയോഗിക്കുക."
 quarantine_quarantine_max_files: "ക്വാറന്റൈനിൽ നിലനിൽക്കാവുന്ന പരമാവധി ഫയലുകളുടെ എണ്ണം. ക്വാറന്റൈനിൽ പുതിയ ഫയലുകൾ ചേർക്കുമ്പോൾ, ഈ സംഖ്യ കവിഞ്ഞാൽ, പഴയ ഫയലുകൾ ഇല്ലാതാക്കപ്പെടും, ബാക്കിയുള്ളവ ഈ സംഖ്യയിൽ കവിയുന്നത് നിർത്തും. സ്ഥിരസ്ഥിതി = 100."
 quarantine_quarantine_max_filesize: "ഫയലുകൾ ക്വാറന്റൈൻ ചെയ്യാൻ അനുവദിക്കപ്പെട്ട പരമാവധി ഫയൽ വലുപ്പം. വ്യക്തമാക്കിയ മൂല്യത്തേക്കാൾ വലിയ ഫയലുകൾ ക്വാറന്റൈൻ ചെയ്യില്ല. ഈ നിർദ്ദേശം ആക്രമണകാരികൾക്ക് നിങ്ങളുടെ ക്വാറന്റൈനിൽ അനാവശ്യ ഡാറ്റ നിറയ്ക്കുന്നത് കൂടുതൽ ബുദ്ധിമുട്ടാക്കാൻ സഹായിക്കുന്നു (അത്തരം അനാവശ്യ ഡാറ്റ നിങ്ങളുടെ ഹോസ്റ്റിംഗ് സേവനത്തിൽ അധിക ഡാറ്റ ഉപയോഗത്തിന് കാരണമായേക്കാം). സ്ഥിരസ്ഥിതി = 2MB."
 quarantine_quarantine_max_usage: "ക്വാറന്റൈനിൽ അനുവദനീയമായ പരമാവധി മെമ്മറി ഉപയോഗം. ക്വാറന്റൈൻ ഉപയോഗിക്കുന്ന മൊത്തം മെമ്മറി ഈ മൂല്യത്തിൽ എത്തിയാൽ, ഉപയോഗിച്ച മൊത്തം മെമ്മറി ഈ മൂല്യത്തിൽ എത്തുന്നതുവരെ ഏറ്റവും പഴയ ക്വാറന്റൈൻ ചെയ്ത ഫയലുകൾ ഇല്ലാതാക്കപ്പെടും. ഈ നിർദ്ദേശം ആക്രമണകാരികൾക്ക് നിങ്ങളുടെ ക്വാറന്റൈനിൽ അനാവശ്യ ഡാറ്റ നിറയ്ക്കുന്നത് കൂടുതൽ ബുദ്ധിമുട്ടാക്കാൻ സഹായിക്കുന്നു (അത്തരം അനാവശ്യ ഡാറ്റ നിങ്ങളുടെ ഹോസ്റ്റിംഗ് സേവനത്തിൽ അധിക ഡാറ്റ ഉപയോഗത്തിന് കാരണമായേക്കാം). സ്ഥിരസ്ഥിതി = 64MB."
 signatures: "ഒപ്പുകൾ, ഒപ്പ് ഫയലുകൾ, മുതലായവയ്ക്കുള്ള കോൺഫിഗറേഷൻ."
 signatures_active: "കോമകളാൽ വേർതിരിച്ച, സജീവമായ ഒപ്പ് ഫയലുകളുടെ ഒരു പട്ടിക. കുറിപ്പ്: ഒപ്പ് ഫയലുകൾ സജീവമാക്കുന്നതിന് മുമ്പ്, അവ ആദ്യം ഇൻസ്റ്റാൾ ചെയ്യണം. ടെസ്റ്റ് ഫയലുകൾ ശരിയായി പ്രവർത്തിക്കണമെങ്കിൽ, ഒപ്പ് ഫയലുകൾ ഇൻസ്റ്റാൾ ചെയ്ത് സജീവമാക്കണം."
 signatures_detect_adware: "ആഡ്‌വെയർ കണ്ടെത്തുന്നതിന് phpMussel ഒപ്പുകൾ ഉപയോഗിക്കണമോ? False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 signatures_detect_deface: "ഡീഫേസ്‌മെന്റുകളും ഡീഫേസറുകളും കണ്ടെത്തുന്നതിന് phpMussel ഒപ്പുകൾ ഉപയോഗിക്കണമോ? False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 signatures_detect_encryption: "phpMussel എൻക്രിപ്റ്റ് ചെയ്ത ഫയലുകൾ കണ്ടെത്തി തടയണോ? False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 signatures_detect_joke_hoax: "തമാശ/തട്ടിപ്പ് മാൽവെയർ/വൈറസുകൾ കണ്ടെത്തുന്നതിന് phpMussel ഒപ്പുകൾ ഉപയോഗിക്കണമോ? False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 signatures_detect_packer_packed: "പാക്കറുകളും പാക്ക് ചെയ്ത ഡാറ്റയും കണ്ടെത്തുന്നതിന് phpMussel ഒപ്പുകൾ ഉപയോഗിക്കണമോ? False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 signatures_detect_pua_pup: "PUA-കൾ/PUP-കൾ കണ്ടെത്തുന്നതിന് phpMussel ഒപ്പുകൾ ഉപയോഗിക്കണമോ? False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 signatures_detect_shell: "ഷെൽ സ്ക്രിപ്റ്റുകൾ കണ്ടെത്തുന്നതിന് phpMussel ഒപ്പുകൾ ഉപയോഗിക്കണമോ? False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 signatures_fail_extensions_silently: "എക്സ്റ്റൻഷനുകൾ നഷ്ടപ്പെട്ടാൽ phpMussel റിപ്പോർട്ട് ചെയ്യണോ? <code>fail_extensions_silently</code> പ്രവർത്തനരഹിതമാക്കിയിട്ടുണ്ടെങ്കിൽ, സ്കാൻ ചെയ്യുമ്പോൾ നഷ്ടപ്പെട്ട എക്സ്റ്റൻഷനുകൾ റിപ്പോർട്ട് ചെയ്യപ്പെടും, <code>fail_extensions_silently</code> പ്രവർത്തനക്ഷമമാക്കിയിട്ടുണ്ടെങ്കിൽ, നഷ്ടപ്പെട്ട എക്സ്റ്റൻഷനുകൾ അവഗണിക്കപ്പെടും, കൂടാതെ സ്കാൻ ആ ഫയലുകൾക്ക് പ്രശ്‌നങ്ങളൊന്നുമില്ലെന്ന് റിപ്പോർട്ട് ചെയ്യും. ഈ നിർദ്ദേശം പ്രവർത്തനരഹിതമാക്കുന്നത് നിങ്ങളുടെ സുരക്ഷ വർദ്ധിപ്പിക്കാൻ സാധ്യതയുണ്ട്, പക്ഷേ തെറ്റായ പോസിറ്റീവുകൾ വർദ്ധിക്കുന്നതിലേക്കും നയിച്ചേക്കാം. False = അപ്രാപ്തമാക്കി; True = പ്രവർത്തനക്ഷമമാക്കി [സ്ഥിരസ്ഥിതി]."
 signatures_fail_silently: "ഒപ്പ് ഫയലുകൾ കാണാതാകുകയോ കേടാകുകയോ ചെയ്യുമ്പോൾ phpMussel റിപ്പോർട്ട് ചെയ്യണോ? <code>fail_silently</code> പ്രവർത്തനരഹിതമാക്കിയിട്ടുണ്ടെങ്കിൽ, നഷ്ടപ്പെട്ടതും കേടായതുമായ ഫയലുകൾ സ്കാൻ ചെയ്യുമ്പോൾ റിപ്പോർട്ട് ചെയ്യപ്പെടും, <code>fail_silently</code> പ്രവർത്തനക്ഷമമാക്കിയിട്ടുണ്ടെങ്കിൽ, നഷ്ടപ്പെട്ടതും കേടായതുമായ ഫയലുകൾ അവഗണിക്കപ്പെടും, കൂടാതെ ആ ഫയലുകൾക്ക് പ്രശ്‌നങ്ങളൊന്നുമില്ലെന്ന് സ്കാൻ റിപ്പോർട്ട് ചെയ്യും. ക്രാഷുകളോ സമാനമായ പ്രശ്‌നങ്ങളോ അനുഭവപ്പെടുമ്പോൾ ഒഴികെ ഇത് ഒറ്റയ്ക്ക് വിടണം. False = അപ്രാപ്തമാക്കി; True = പ്രവർത്തനക്ഷമമാക്കി [സ്ഥിരസ്ഥിതി]."
 signatures_heuristic_threshold: "ചില phpMussel ഒപ്പുകൾ ഫയലുകളെ ക്ഷുദ്രകരമായി അടയാളപ്പെടുത്താതെ സംശയാസ്പദമായി അടയാളപ്പെടുത്താൻ ഉദ്ദേശിച്ചുള്ളതാണ്. ഫയലുകളെ ക്ഷുദ്രകരമായി അടയാളപ്പെടുത്തുന്നതിന് മുമ്പ് അനുവദനീയമായ പരമാവധി സംശയം ഈ മൂല്യം phpMussel-നോട് പറയുന്നു. സ്ഥിരസ്ഥിതിയായി, ഈ മൂല്യം 3 ആയി സജ്ജീകരിക്കും. ഒരു താഴ്ന്ന മൂല്യം സാധാരണയായി തെറ്റായ പോസിറ്റീവുകളുടെ ഉയർന്ന സംഭവത്തിന് കാരണമാകും എന്നാൽ കൂടുതൽ ഫയലുകൾ ക്ഷുദ്രകരമായി അടയാളപ്പെടുത്തും, അതേസമയം ഉയർന്ന മൂല്യം സാധാരണയായി തെറ്റായ പോസിറ്റീവുകളുടെ കുറഞ്ഞ സംഭവത്തിനും കുറഞ്ഞ ഫയലുകൾ ക്ഷുദ്രകരമായി അടയാളപ്പെടുത്താനും കാരണമാകും. നിങ്ങൾക്ക് എന്തെങ്കിലും പ്രശ്‌നങ്ങൾ അനുഭവപ്പെടുന്നുണ്ടെങ്കിൽ മാത്രം ഈ മൂല്യം മാറ്റുന്നതാണ് പൊതുവെ നല്ലത്."
 supplementary_cache_options: "അധിക കാഷെ ഓപ്ഷനുകൾ. കുറിപ്പ്: ഈ മൂല്യങ്ങൾ മാറ്റുന്നത് നിങ്ങളെ ലോഗ് ഔട്ട് ചെയ്യാൻ സാധ്യതയുണ്ട്."
