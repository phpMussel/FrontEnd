 core_maintenance_mode: "മെയിന്റനൻസ് മോഡ് പ്രാപ്തമാക്കണോ? True = അതെ; False = ഇല്ല [സ്ഥിരസ്ഥിതി]. ഫ്രണ്ട്-എൻഡ് ഒഴികെയുള്ള എല്ലാം പ്രവർത്തനരഹിതമാക്കുന്നു. നിങ്ങളുടെ CMS, ഫ്രെയിംവർക്കുകൾ, മുതലായവ അപ്‌ഡേറ്റ് ചെയ്യുമ്പോൾ ചിലപ്പോൾ ഉപയോഗപ്രദമാകും."
