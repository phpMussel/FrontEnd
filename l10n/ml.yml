 urlscanner_maximum_api_lookups: "ഓരോ സ്കാൻ ആവർത്തനത്തിനും അനുവദനീയമായ പരമാവധി എണ്ണം API ലുക്കപ്പുകൾ. ഓരോ അധിക API ലുക്കപ്പും ഓരോ സ്കാൻ ആവർത്തനവും പൂർത്തിയാക്കാൻ ആവശ്യമായ ആകെ സമയത്തിലേക്ക് ചേർക്കുമെന്നതിനാൽ, മൊത്തത്തിലുള്ള സ്കാൻ പ്രക്രിയ വേഗത്തിലാക്കാൻ നിങ്ങൾക്ക് ഒരു പരിധി നിശ്ചയിക്കാവുന്നതാണ്. 0 ആയി സജ്ജമാക്കുമ്പോൾ, അത്തരം പരമാവധി ബാധകമാകില്ല. സ്ഥിരസ്ഥിതിയായി 10 ആയി സജ്ജമാക്കുക."
