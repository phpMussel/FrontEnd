 core_log_rotation_action: "ലോഗ് റൊട്ടേഷൻ ഒരേ സമയം നിലനിൽക്കേണ്ട ലോഗ് ഫയലുകളുടെ എണ്ണം പരിമിതപ്പെടുത്തുന്നു. പുതിയ ലോഗ് ഫയലുകൾ സൃഷ്ടിക്കുമ്പോൾ, മൊത്തം ലോഗ് ഫയലുകളുടെ എണ്ണം നിർദ്ദിഷ്ട പരിധി കവിയുന്നുവെങ്കിൽ, നിർദ്ദിഷ്ട പ്രവർത്തനം നടപ്പിലാക്കും. നിങ്ങൾക്ക് ആവശ്യമുള്ള പ്രവർത്തനം ഇവിടെ വ്യക്തമാക്കാം."
