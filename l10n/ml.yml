 files: "സ്കാൻ ചെയ്യുമ്പോൾ ഫയലുകൾ എങ്ങനെ കൈകാര്യം ചെയ്യണമെന്നതിന്റെ പ്രത്യേകതകൾ."
 files_allow_leading_trailing_dots: "ഫയൽ നാമങ്ങളിൽ മുന്നിലും പിന്നിലും കുത്തുകൾ അനുവദിക്കണോ? ഇത് ചിലപ്പോൾ ഫയലുകൾ മറയ്ക്കാനോ ചില സിസ്റ്റങ്ങളെ കബളിപ്പിച്ച് ഡയറക്ടറി ട്രാവെർസൽ അനുവദിക്കാനോ ഉപയോഗിക്കാം. False = അനുവദിക്കരുത് [സ്ഥിരസ്ഥിതി]. True = അനുവദിക്കുക."
 files_archive_file_extensions: "തിരിച്ചറിഞ്ഞ ആർക്കൈവ് ഫയൽ എക്സ്റ്റൻഷനുകൾ (ഫോർമാറ്റ് CSV ആണ്; പ്രശ്നങ്ങൾ ഉണ്ടാകുമ്പോൾ മാത്രമേ ചേർക്കാനോ നീക്കം ചെയ്യാനോ പാടുള്ളൂ; അനാവശ്യമായ നീക്കം ചെയ്യൽ ആർക്കൈവ് ഫയലുകളിൽ തെറ്റായ പോസിറ്റീവുകൾ പ്രത്യക്ഷപ്പെടാൻ കാരണമായേക്കാം, അതേസമയം അനാവശ്യമായ കൂട്ടിച്ചേർക്കൽ ആക്രമണ നിർദ്ദിഷ്ട കണ്ടെത്തലിൽ നിന്ന് നിങ്ങൾ ചേർക്കുന്നതിനെ ഫലപ്രദമായി വൈറ്റ്‌ലിസ്റ്റ് ചെയ്യും; ജാഗ്രതയോടെ മാറ്റം വരുത്തുക; ഉള്ളടക്ക തലത്തിൽ ആർക്കൈവുകൾ വിശകലനം ചെയ്യാൻ കഴിയുന്നതിനെ ഇത് ഒരു തരത്തിലും ബാധിക്കില്ലെന്നത് ശ്രദ്ധിക്കുക). ഡിഫോൾട്ടായി, ഭൂരിഭാഗം സിസ്റ്റങ്ങളിലും CMS-ലും ഏറ്റവും സാധാരണയായി ഉപയോഗിക്കുന്ന ഫോർമാറ്റുകൾ ഈ പട്ടികയിലുണ്ട്, പക്ഷേ മനഃപൂർവ്വം സമഗ്രമായിരിക്കണമെന്നില്ല."
 files_block_control_characters: "പുതിയ വരികൾ ഒഴികെയുള്ള ഏതെങ്കിലും നിയന്ത്രണ പ്രതീകങ്ങൾ അടങ്ങിയ ഏതെങ്കിലും ഫയലുകൾ തടയണോ? നിങ്ങൾ പ്ലെയിൻ-ടെക്‌സ്റ്റ് മാത്രമാണ് അപ്‌ലോഡ് ചെയ്യുന്നതെങ്കിൽ, ഈ ഓപ്ഷൻ പ്രവർത്തനക്ഷമമാക്കുന്നത് നിങ്ങളുടെ സിസ്റ്റത്തിന് കുറച്ച് അധിക പരിരക്ഷ നൽകും. എന്നിരുന്നാലും, പ്ലെയിൻ-ടെക്‌സ്റ്റ് അല്ലാതെ മറ്റെന്തെങ്കിലും അപ്‌ലോഡ് ചെയ്യുകയാണെങ്കിൽ, ഈ ഓപ്ഷൻ പ്രവർത്തനക്ഷമമാക്കുന്നത് തെറ്റായ പോസിറ്റീവുകൾക്ക് കാരണമായേക്കാം. False = തടയരുത് [സ്ഥിരസ്ഥിതി]; True = തടയുക."
 files_block_encrypted_archives: "എൻക്രിപ്റ്റ് ചെയ്ത ആർക്കൈവുകൾ കണ്ടെത്തി തടയുക ചെയ്യണോ? എൻക്രിപ്റ്റ് ചെയ്ത ആർക്കൈവുകളുടെ ഉള്ളടക്കങ്ങൾ സ്കാൻ ചെയ്യാൻ phpMussel-ന് കഴിയാത്തതിനാൽ, phpMussel, ആന്റി-വൈറസ് സ്കാനറുകൾ, മറ്റ് അത്തരം പരിരക്ഷകൾ എന്നിവ മറികടക്കാൻ ശ്രമിക്കുന്നതിനുള്ള ഒരു മാർഗമായി ഒരു ആക്രമണകാരി ആർക്കൈവ് എൻക്രിപ്ഷൻ ഉപയോഗിക്കാൻ സാധ്യതയുണ്ട്. എൻക്രിപ്റ്റ് ചെയ്തതായി കണ്ടെത്തുന്ന ഏതൊരു ആർക്കൈവുകളും തടയാൻ phpMussel-നോട് നിർദ്ദേശിക്കുന്നത് അത്തരം അപകടസാധ്യത കുറയ്ക്കാൻ സഹായിച്ചേക്കാം. False = ഇല്ല; True = അതെ [സ്ഥിരസ്ഥിതി]."
 files_block_macros: "മാക്രോകൾ അടങ്ങിയ ഏതെങ്കിലും ഫയലുകൾ തടയുക ചെയ്യാൻ ശ്രമിക്കണോ? ചില തരം ഡോക്യുമെന്റുകളിലും സ്പ്രെഡ്ഷീറ്റുകളിലും എക്സിക്യൂട്ടബിൾ മാക്രോകൾ അടങ്ങിയിരിക്കാം, അതുവഴി അപകടകരമായ ഒരു മാൽവെയർ വെക്റ്റർ നൽകുന്നു. False = തടയരുത് [സ്ഥിരസ്ഥിതി]; True = തടയുക."
 files_can_contain_php_file_extensions: "കോമകളാൽ വേർതിരിച്ച്, PHP കോഡ് ഉൾക്കൊള്ളാൻ അനുവദനീയമായ ഫയൽ എക്സ്റ്റെൻഷനുകളുടെ ഒരു ലിസ്റ്റ്. PHP chameleon ആക്രമണ കണ്ടെത്തൽ പ്രാപ്തമാക്കിയിട്ടുണ്ടെങ്കിൽ, ഈ ലിസ്റ്റിൽ ഇല്ലാത്ത എക്സ്റ്റൻഷനുകളുള്ള PHP കോഡ് അടങ്ങിയ ഫയലുകൾ PHP chameleon ആക്രമണങ്ങളായി കണ്ടെത്തപ്പെടും."
 files_chameleon_from_exe: "എക്സിക്യൂട്ടബിൾ അല്ലാത്തതോ തിരിച്ചറിഞ്ഞിട്ടില്ല ആർക്കൈവുകളോ അല്ലാത്ത ഫയലുകളിൽ എക്സിക്യൂട്ടബിൾ ഹെഡറുകൾക്കായും തെറ്റായ ഹെഡറുകൾ ഉള്ള എക്സിക്യൂട്ടബിൾ ഹെഡറുകൾക്കായും തിരയുക. False = ഓഫാകും; True = ഓണാകും."
 files_chameleon_from_php: "PHP ഫയലുകളോ തിരിച്ചറിഞ്ഞിട്ടില്ല ആർക്കൈവുകളോ അല്ലാത്ത ഫയലുകളിൽ PHP ഹെഡറുകൾക്കായി തിരയുക. False = ഓഫാകും; True = ഓണാകും."
 files_chameleon_to_archive: "ആർക്കൈവുകളിലും കംപ്രസ് ചെയ്ത ഫയലുകളിലും തെറ്റായ ഹെഡറുകൾ കണ്ടെത്തുക. പിന്തുണയ്ക്കുന്ന ഫോർമാറ്റുകൾ: BZ/BZIP2, GZ/GZIP, LZF, RAR, ZIP. False = ഓഫാകും; True = ഓണാകും."
 files_chameleon_to_doc: "ഹെഡറുകൾ തെറ്റുള്ള ഓഫീസ് പ്രമാണങ്ങൾക്കായി തിരയുക (പിന്തുണയ്ക്കുന്ന ഫോർമാറ്റുകൾ: DOC, DOT, PPS, PPT, XLA, XLS, WIZ). False = ഓഫാകും; True = ഓണാകും."
 files_chameleon_to_img: "ഹെഡറുകൾ തെറ്റുള്ള ചിത്രങ്ങൾക്കായി തിരയുക (പിന്തുണയ്ക്കുന്ന ഫോർമാറ്റുകൾ: BMP, DIB, PNG, GIF, JPEG, JPG, XCF, PSD, PDD, WEBP). False = ഓഫാകും; True = ഓണാകും."
 files_chameleon_to_pdf: "ഹെഡറുകൾ തെറ്റുള്ള PDF ഫയലുകൾക്കായി തിരയുക. False = ഓഫാകും; True = ഓണാകും."
 files_check_archives: "ആർക്കൈവുകളിലെ ഉള്ളടക്കങ്ങൾ പരിശോധിക്കാൻ ശ്രമിക്കണോ? False = പരിശോധിക്കരുത്; True = പരിശോധിക്കുക [സ്ഥിരസ്ഥിതി]. പിന്തുണയ്ക്കുന്ന: Zip (libzip ആവശ്യമാണ്), Tar, Rar (rar എക്സ്റ്റൻഷൻ ആവശ്യമാണ്)."
 files_corrupted_exe: "കേടായ ഫയലുകളും പാഴ്‌സ് പിശകുകളും. False = അവഗണിക്കുക; True = തടയുക [സ്ഥിരസ്ഥിതി]. കേടാകാൻ സാധ്യതയുള്ള PE (പോർട്ടബിൾ എക്സിക്യൂട്ടബിൾ) ഫയലുകൾ കണ്ടെത്തി തടയുക ചെയ്യണോ? പലപ്പോഴും (എന്നാൽ എല്ലായ്‌പ്പോഴും അല്ല), ഒരു PE ഫയലിന്റെ ചില വശങ്ങൾ കേടാകുകയോ ശരിയായി പാഴ്‌സ് ചെയ്യാൻ കഴിയാതിരിക്കുകയോ ചെയ്യുമ്പോൾ, അത് ഒരു വൈറൽ അണുബാധയുടെ സൂചനയായിരിക്കാം. ഒരു ആന്റി-വൈറസ് പ്രോഗ്രാം PE ഫയലുകൾ എങ്ങനെ പാഴ്‌സ് ചെയ്യുന്നുവെന്ന് ഒരു വൈറസിന്റെ പ്രോഗ്രാമർക്ക് അറിയാമെങ്കിൽ, അവരുടെ വൈറസ് കണ്ടെത്തപ്പെടാതെ തുടരുന്നതിന്, അത് പ്രത്യേകമായി തടയാൻ അവർ ശ്രമിച്ചേക്കാം."
 files_decode_threshold: "ഡീകോഡ് കമാൻഡുകൾ കണ്ടെത്തേണ്ട പരമാവധി റോ ഡാറ്റ ദൈർഘ്യം (സ്കാൻ ചെയ്യുമ്പോൾ ശ്രദ്ധേയമായ പ്രകടന പ്രശ്നങ്ങൾ ഉണ്ടായാൽ). സ്ഥിരസ്ഥിതി = 512KB. ഫയലുകളുടെ വലിപ്പത്തെ അടിസ്ഥാനമാക്കിയുള്ള അത്തരം ഏതൊരു പരിമിതിയും 0 നീക്കംചെയ്യുന്നു."
 files_entropy_filesize_limit: "സാധാരണ ഡാറ്റ ഉപയോഗിക്കുന്ന ഒപ്പുകൾക്കുള്ള എൻട്രോപ്പി ഫയൽ വലുപ്പ പരിധി (സ്ഥിരസ്ഥിതി 512KB ആണ്). എൻട്രോപ്പി പരിധിയും എൻട്രോപ്പി ഫയൽ വലുപ്പ പരിധിയും കവിയുമ്പോൾ, തെറ്റായ പോസിറ്റീവുകളുടെ അപകടസാധ്യത കുറയ്ക്കുന്നതിന്, സാധാരണ ഡാറ്റ ഉപയോഗിക്കുന്ന ചില ഒപ്പുകൾ അവഗണിക്കപ്പെടും."
 files_entropy_limit: "സാധാരണ ഡാറ്റ ഉപയോഗിക്കുന്ന ഒപ്പുകൾക്കുള്ള എൻട്രോപ്പി പരിധി (സ്ഥിരസ്ഥിതി 7.7 ആണ്). ഇവിടെ, എൻട്രോപ്പി എന്നത് സ്കാൻ ചെയ്യുന്ന ഫയലിന്റെ ഉള്ളടക്കത്തിന്റെ ഷാനൺ എൻട്രോപ്പിയായി നിർവചിച്ചിരിക്കുന്നു. എൻട്രോപ്പി പരിധിയും എൻട്രോപ്പി ഫയൽ വലുപ്പ പരിധിയും കവിയുമ്പോൾ, തെറ്റായ പോസിറ്റീവുകളുടെ അപകടസാധ്യത കുറയ്ക്കുന്നതിന്, സാധാരണ ഡാറ്റ ഉപയോഗിക്കുന്ന ചില ഒപ്പുകൾ അവഗണിക്കപ്പെടും."
 frontend_magnification: "ഫോണ്ട് മാഗ്നിഫിക്കേഷൻ. സ്ഥിരസ്ഥിതി = 1."
