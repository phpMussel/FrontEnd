tip:
 2FA Sent: "രണ്ട്-ഘടക പ്രാമാണീകരണ കോഡ് അടങ്ങിയ ഒരു ഇമെയിൽ നിങ്ങളുടെ ഇമെയിൽ വിലാസത്തിലേക്ക് അയച്ചു. ഫ്രണ്ട്-എൻഡിലേക്ക് ആക്‌സസ് ലഭിക്കുന്നതിന് താഴെയുള്ള ഈ കോഡ് സ്ഥിരീകരിക്കുക. ഈ ഇമെയിൽ ലഭിച്ചില്ലെങ്കിൽ, ലോഗ് ഔട്ട് ചെയ്ത്, 10 മിനിറ്റ് കാത്തിരുന്ന്, പുതിയ കോഡ് അടങ്ങിയ പുതിയ ഇമെയിൽ ലഭിക്കാൻ വീണ്ടും ലോഗിൻ ചെയ്യാൻ ശ്രമിക്കുക."
 Accounts: "phpMussel ഫ്രണ്ട്-എൻഡ് ആർക്കൊക്കെ ആക്‌സസ് ചെയ്യാമെന്ന് നിയന്ത്രിക്കാൻ അക്കൗണ്ടുകൾ പേജ് നിങ്ങളെ അനുവദിക്കുന്നു."
 Cache Data: "കാഷെയിലെ ഉള്ളടക്കങ്ങൾ നിങ്ങൾക്ക് ഇവിടെ അവലോകനം ചെയ്യാൻ കഴിയും."
 Configuration: "ഫ്രണ്ട്-എൻഡിൽ നിന്ന് phpMussel-നുള്ള കോൺഫിഗറേഷൻ പരിഷ്കരിക്കാൻ കോൺഫിഗറേഷൻ പേജ് നിങ്ങളെ അനുവദിക്കുന്നു."
 Greeting: "ഹലോ, %s."
 Home: "ഇതാണ് phpMussel ഫ്രണ്ട്-എൻഡിനായുള്ള ഹോംപേജ്. തുടരുന്നതിന് ഇടതുവശത്തുള്ള നാവിഗേഷൻ മെനുവിൽ നിന്ന് ഒരു ലിങ്ക് തിരഞ്ഞെടുക്കുക."
 Logs: "ഒരു ലോഗ് ഫയലിന്റെ ഉള്ളടക്കം കാണുന്നതിന്, താഴെയുള്ള പട്ടികയിൽ നിന്ന് അത് തിരഞ്ഞെടുക്കുക."
 Quarantine is currently disabled: "കുറിപ്പ്: ക്വാറന്റൈൻ നിലവിൽ പ്രവർത്തനരഹിതമാക്കിയിരിക്കുന്നു, പക്ഷേ കോൺഫിഗറേഷൻ പേജ് വഴി പ്രവർത്തനക്ഷമമാക്കാം."
 Quarantine: "ഈ പേജ് നിലവിൽ ക്വാറന്റൈനിലുള്ള എല്ലാ ഫയലുകളും പട്ടികപ്പെടുത്തുകയും ആ ഫയലുകളുടെ മാനേജ്മെന്റിനെ സുഗമമാക്കുകയും ചെയ്യുന്നു."
 See the documentation: "വിവിധ കോൺഫിഗറേഷൻ നിർദ്ദേശങ്ങളെയും അവയുടെ ഉദ്ദേശ്യങ്ങളെയും കുറിച്ചുള്ള വിവരങ്ങൾക്ക് <a href="https://github.com/phpMussel/Docs/blob/master/readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external">ഡോക്യുമെന്റേഷൻ</a> കാണുക."
