 Statistics: "നിങ്ങളുടെ phpMussel ഇൻസ്റ്റാളേഷനെക്കുറിച്ചുള്ള ചില അടിസ്ഥാന ഉപയോഗ സ്ഥിതിവിവരക്കണക്കുകൾ ഈ പേജ് കാണിക്കുന്നു."
 Upload Testing: "അപ്‌ലോഡ് ടെസ്റ്റിംഗ് പേജിൽ ഒരു സ്റ്റാൻഡേർഡ് ഫയൽ അപ്‌ലോഡ് ഫോം അടങ്ങിയിരിക്കുന്നു, ഒരു ഫയൽ അപ്‌ലോഡ് ചെയ്യാൻ ശ്രമിക്കുമ്പോൾ സാധാരണയായി phpMussel അത് തടയുമോ എന്ന് പരിശോധിക്കാൻ ഇത് നിങ്ങളെ അനുവദിക്കുന്നു."
