 core_delete_on_sight: "ഈ നിർദ്ദേശം പ്രാപ്തമാക്കുന്നത്, ഒപ്പുകൾ വഴിയോ മറ്റേതെങ്കിലും വഴിയോ, ഏതെങ്കിലും കണ്ടെത്തൽ മാനദണ്ഡങ്ങളുമായി പൊരുത്തപ്പെടുന്ന, സ്കാൻ ചെയ്ത ശ്രമിച്ച ഫയൽ അപ്‌ലോഡ് ഉടനടി ഇല്ലാതാക്കാൻ സ്ക്രിപ്റ്റിനോട് നിർദ്ദേശിക്കും. ക്ലീൻ എന്ന് തിരിച്ചറിഞ്ഞ ഫയലുകൾ തൊടില്ല. ആർക്കൈവുകളുടെ കാര്യത്തിൽ, കുറ്റകരമായ ഫയൽ ആർക്കൈവിനുള്ളിൽ അടങ്ങിയിരിക്കുന്ന നിരവധി ഫയലുകളിൽ ഒന്ന് മാത്രമാണോ എന്നത് പരിഗണിക്കാതെ തന്നെ, മുഴുവൻ ആർക്കൈവും ഇല്ലാതാക്കപ്പെടും. ഫയൽ അപ്‌ലോഡ് സ്കാനിംഗിന്, സാധാരണയായി, ഈ നിർദ്ദേശം പ്രാപ്തമാക്കേണ്ട ആവശ്യമില്ല, കാരണം സാധാരണയായി, എക്സിക്യൂഷൻ പൂർത്തിയാകുമ്പോൾ PHP അതിന്റെ കാഷെയിലെ ഉള്ളടക്കങ്ങൾ യാന്ത്രികമായി ശുദ്ധീകരിക്കും,അതായത് സെർവറിലേക്ക് അപ്‌ലോഡ് ചെയ്‌ത എല്ലാ ഫയലുകളും, അവ ഇതിനകം നീക്കുകയോ പകർത്തുകയോ ഇല്ലാതാക്കുകയോ ചെയ്‌തിട്ടില്ലെങ്കിൽ, സാധാരണയായി അത് ഇല്ലാതാക്കും. PHP യുടെ പകർപ്പുകൾ എല്ലായ്പ്പോഴും പ്രതീക്ഷിക്കുന്ന രീതിയിൽ പ്രവർത്തിക്കണമെന്നില്ല എന്നതിനുള്ള ഒരു അധിക സുരക്ഷാ മാനദണ്ഡമായിട്ടാണ് ഈ നിർദ്ദേശം ഇവിടെ ചേർത്തിരിക്കുന്നത്. False = സ്കാൻ ചെയ്ത ശേഷം, ഫയൽ വെറുതെ വിടുക [സ്ഥിരസ്ഥിതി]; True = സ്കാൻ ചെയ്ത ശേഷം, വൃത്തിയാക്കിയില്ലെങ്കിൽ, ഉടനടി ഇല്ലാതാക്കുക."
 core_disabled_channels: "അഭ്യർത്ഥനകൾ അയയ്ക്കുമ്പോൾ phpMussel പ്രത്യേക ചാനലുകൾ ഉപയോഗിക്കുന്നത് തടയാൻ ഇത് ഉപയോഗിക്കാം."
