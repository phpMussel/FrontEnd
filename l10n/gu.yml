 supplementary_cache_options_memcached_port: "Memcached પોર્ટ મૂલ્ય. ડિફૉલ્ટ = "11211"."
 supplementary_cache_options_pdo_dsn: "PDO DSN મૂલ્ય. ડિફૉલ્ટ = "mysql:dbname=phpmussel;host=localhost;port=3306"."
 supplementary_cache_options_pdo_password: "PDO પાસવર્ડ."
 supplementary_cache_options_pdo_username: "PDO વપરાશકર્તા નામ."
 supplementary_cache_options_prefix: "અહીં ઉલ્લેખિત મૂલ્ય બધી કેશ એન્ટ્રી કીમાં આગળ મૂકવામાં આવશે. ડિફૉલ્ટ = "phpMussel_". જ્યારે એક જ સર્વર પર બહુવિધ સ્થાપનો અસ્તિત્વ ધરાવે છે, ત્યારે આ તેમના કેશને એકબીજાથી અલગ રાખવા માટે ઉપયોગી થઈ શકે છે."
