 core_time_format: "phpMussel દ્વારા વપરાતું તારીખ/સમય નોટેશન ફોર્મેટ. વિનંતી પર વધારાના વિકલ્પો ઉમેરી શકાય છે."
 core_time_offset: "ટાઈમઝોન મિનિટમાં ઓફસેટ."
 core_timezone: "કયા ટાઈમઝોનનો ઉપયોગ કરવો (દા.ત., Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, વગેરે). PHP ને તમારા માટે આને આપમેળે હેન્ડલ કરવા દેવા માટે "SYSTEM" નો ઉલ્લેખ કરો."
 core_truncate: "લૉગ ફાઇલો જ્યારે ચોક્કસ કદ સુધી પહોંચે ત્યારે તેને કાપી નાખો? મૂલ્ય એ B/KB/MB/GB/TB માં મહત્તમ કદ છે જે કાપવામાં આવે તે પહેલાં લોગ ફાઇલ વધી શકે છે. 0KB નું ડિફૉલ્ટ મૂલ્ય ટ્રંકેશનને અક્ષમ કરે છે (લોગ ફાઇલો અનિશ્ચિત રીતે વધી શકે છે). નૉૅધ: અલગ લૉગ ફાઇલો પર લાગુ થાય છે! લોગ ફાઇલોનું કદ સામૂહિક રીતે ગણવામાં આવતું નથી."
 experimental: "અસ્થિર/પ્રાયોગિક!"
 files: "સ્કેન કરતી વખતે ફાઇલોને કેવી રીતે હેન્ડલ કરવી તેની વિશિષ્ટતાઓ."
 files_allow_leading_trailing_dots: "ફાઇલનામોમાં આગળ અને પાછળના બિંદુઓને મંજૂરી આપીએ? આનો ઉપયોગ કેટલીકવાર ફાઈલોને છુપાવવા માટે અથવા કેટલીક સિસ્ટમોને ડાયરેક્ટરી ટ્રાવર્સલને મંજૂરી આપવા માટે કરી શકાય છે. False/ખોટા = મંજૂરી આપશો નહીં [ડિફૉલ્ટ]. True/સાચું = મંજૂરી આપો."
 files_archive_file_extensions: "ઓળખાયેલ આર્કાઇવ ફાઇલ એક્સ્ટેંશન (ફોર્મેટ CSV છે; જ્યારે સમસ્યાઓ આવે ત્યારે જ ઉમેરવું અથવા દૂર કરવું જોઈએ; બિનજરૂરી રીતે દૂર કરવાથી આર્કાઇવ ફાઇલો માટે ખોટા ધન દેખાવાનું કારણ બની શકે છે, જ્યારે બિનજરૂરી રીતે ઉમેરવાથી એટેક ચોક્કસ શોધમાંથી તમે શું ઉમેરી રહ્યાં છો તે આવશ્યકપણે વ્હાઇટલિસ્ટ થશે; સાવધાની સાથે સુધારો; એ પણ નોંધ કરો કે સામગ્રી-સ્તર પર આર્કાઇવ્સ શું પૃથ્થકરણ કરી શકાય છે અને શું કરી શકાતું નથી તેના પર આની કોઈ અસર નથી). સૂચિ, પ્રમાણભૂત તરીકે, મોટાભાગની સિસ્ટમ્સ અને CMSમાં સામાન્ય રીતે ઉપયોગમાં લેવાતા ફોર્મેટ્સની સૂચિ આપે છે, પરંતુ ઇરાદાપૂર્વક તે વ્યાપક હોય તે જરૂરી નથી."
 files_block_control_characters: "કોઈપણ નિયંત્રણ અક્ષરો ધરાવતી કોઈપણ ફાઇલોને અવરોધિત કરીએ (નવી લીટીઓ સિવાયની)? જો તમે ફક્ત સાદો લખાણ અપલોડ કરી રહ્યાં છો, તો પછી તમે તમારી સિસ્ટમને કેટલીક વધારાની સુરક્ષા પ્રદાન કરવા માટે આ વિકલ્પ ચાલુ કરી શકો છો. જો કે, જો તમે સાદા-ટેક્સ્ટ સિવાય બીજું કંઈપણ અપલોડ કરો છો, તો આને ચાલુ કરવાથી ખોટા હકારાત્મક પરિણામો આવી શકે છે. False/ખોટા = અવરોધિત કરશો નહીં [ડિફૉલ્ટ]; True/સાચું = અવરોધિત કરો."
 files_block_encrypted_archives: "એન્ક્રિપ્ટેડ આર્કાઇવ્સને શોધી અને અવરોધિત કરીએ? કારણ કે phpMussel એન્ક્રિપ્ટેડ આર્કાઇવ્સની સામગ્રીને સ્કેન કરવામાં સક્ષમ નથી, શક્ય છે કે હુમલાખોર દ્વારા phpMussel, એન્ટી-વાયરસ સ્કેનર્સ અને આવા અન્ય રક્ષણોને બાયપાસ કરવાના પ્રયાસના માધ્યમ તરીકે આર્કાઇવ એન્ક્રિપ્શનનો ઉપયોગ કરવામાં આવે. phpMussel ને કોઈપણ આર્કાઈવ્સને અવરોધિત કરવા સૂચના આપવી જે તેને એન્ક્રિપ્ટેડ હોવાનું જણાય છે તે સંભવિતપણે આવી શક્યતાઓ સાથે સંકળાયેલ કોઈપણ જોખમને ઘટાડવામાં મદદ કરી શકે છે. False/ખોટા = ના; True/સાચું = હા [ડિફૉલ્ટ]."
 files_block_macros: "મેક્રો ધરાવતી કોઈપણ ફાઇલોને અવરોધિત કરવાનો પ્રયાસ કરીએ? કેટલાક પ્રકારના દસ્તાવેજો અને સ્પ્રેડશીટ્સમાં એક્ઝિક્યુટેબલ મેક્રો હોઈ શકે છે, આમ જોખમી સંભવિત માલવેર વેક્ટર પ્રદાન કરે છે. False/ખોટા = અવરોધિત કરશો નહીં [ડિફૉલ્ટ]; True/સાચું = અવરોધિત કરો."
 files_can_contain_php_file_extensions: "અલ્પવિરામ દ્વારા વિભાજિત, PHP કોડ સમાવવાની મંજૂરી ફાઇલ એક્સ્ટેંશનની સૂચિ. જો PHP કાચંડો હુમલો શોધ સક્ષમ કરેલ હોય, તો PHP કોડ ધરાવતી ફાઇલો, જેમાં એક્સ્ટેંશન છે જે આ સૂચિમાં નથી, તે PHP કાચંડો હુમલા તરીકે શોધવામાં આવશે."
 files_chameleon_from_exe: "ફાઈલોમાં એક્ઝેક્યુટેબલ હેડરો માટે શોધો કે જે ન તો એક્ઝિક્યુટેબલ છે કે ન તો માન્ય આર્કાઈવ્સ અને એક્ઝિક્યુટેબલ માટે જેના હેડરો ખોટા છે. False/ખોટા = બંધ; True/સાચું = પર."
 files_chameleon_from_php: "ફાઇલોમાં PHP હેડર્સ માટે શોધો કે જે ન તો PHP ફાઇલો છે કે ન તો ઓળખાયેલ આર્કાઇવ્સ. False/ખોટા = બંધ; True/સાચું = પર."
 files_chameleon_to_archive: "આર્કાઇવ્સ અને સંકુચિત ફાઇલોમાં ખોટા હેડરો શોધો. આધારભૂત: BZ/BZIP2, GZ/GZIP, LZF, RAR, ZIP. False/ખોટા = બંધ; True/સાચું = પર."
 files_chameleon_to_doc: "ઓફિસ દસ્તાવેજો માટે શોધો જેના હેડર ખોટા છે (આધારભૂત: DOC, DOT, PPS, PPT, XLA, XLS, WIZ). False/ખોટા = બંધ; True/સાચું = પર."
 files_chameleon_to_img: "છબીઓ માટે શોધો જેના હેડર ખોટા છે (આધારભૂત: BMP, DIB, PNG, GIF, JPEG, JPG, XCF, PSD, PDD, WEBP). False/ખોટા = બંધ; True/સાચું = પર."
 files_chameleon_to_pdf: "પીડીએફ ફાઇલો માટે શોધો જેના હેડર ખોટા છે. False/ખોટા = બંધ; True/સાચું = પર."
 files_check_archives: "આર્કાઇવ્સની સામગ્રી તપાસવાનો પ્રયાસ કરો છો? False/ખોટા = તપાસશો નહીં; True/સાચું = તપાસો [ડિફૉલ્ટ]. આધારભૂત: Zip (libzip જરૂર છે), Tar, Rar (rar એક્સ્ટેંશનની જરૂર છે)."
 files_corrupted_exe: "દૂષિત ફાઇલો અને પાર્સ ભૂલો. False/ખોટા = અવગણો; True/સાચું = અવરોધિત કરો [ડિફૉલ્ટ]. સંભવિત રીતે દૂષિત PE (પોર્ટેબલ એક્ઝિક્યુટેબલ) ફાઇલોને શોધી અને અવરોધિત કરીએ? ઘણીવાર (પરંતુ હંમેશા નહીં), જ્યારે PE ફાઇલના અમુક પાસાઓ દૂષિત હોય અથવા યોગ્ય રીતે વિશ્લેષિત ન થઈ શકે, ત્યારે તે વાયરલ ચેપનું સૂચક હોઈ શકે છે. PE ફાઇલોમાં વાયરસ શોધવા માટે મોટાભાગના એન્ટી-વાયરસ પ્રોગ્રામ્સ દ્વારા ઉપયોગમાં લેવાતી પ્રક્રિયાઓ માટે તે ફાઇલોને ચોક્કસ રીતે પાર્સ કરવાની જરૂર પડે છે, જે, જો વાયરસના પ્રોગ્રામરને જાણ હોય, તો તેના વાયરસને શોધી ન શકાય તે માટે તેને રોકવા માટે ખાસ પ્રયાસ કરશે."
 files_decode_threshold: "કાચા ડેટાની લંબાઈ માટે થ્રેશોલ્ડ કે જેની અંદર ડીકોડ આદેશો શોધવા જોઈએ (સ્કેન કરતી વખતે કોઈ નોંધપાત્ર કામગીરી સમસ્યાઓ હોય તો). ડિફૉલ્ટ = 512KB. શૂન્ય અથવા નલ થ્રેશોલ્ડને અક્ષમ કરે છે (ફાઇલના કદના આધારે આવી કોઈપણ મર્યાદાને દૂર કરીને)."
 files_filesize_archives: "શું ફાઇલસાઇઝ બ્લેકલિસ્ટ/વ્હાઇટલિસ્ટ આર્કાઇવ્સની સામગ્રી પર લાગુ થવી જોઈએ? False/ખોટા = ના (ફક્ત બધું જ ગ્રેલિસ્ટ કરો); True/સાચું = હા [ડિફૉલ્ટ]."
 files_filesize_limit: "KB માં ફાઇલ કદ મર્યાદા. 65536 = 64MB [ડિફૉલ્ટ]; 0 = કોઈ મર્યાદા નથી (હંમેશા ગ્રેલિસ્ટેડ). કોઈપણ (હકારાત્મક) આંકડાકીય મૂલ્ય સ્વીકૃત. જ્યારે તમારું PHP રૂપરેખાંકન પ્રક્રિયાને પકડી શકે તેટલી મેમરીની માત્રાને મર્યાદિત કરે અથવા જો તમારું PHP રૂપરેખાંકન અપલોડ્સના ફાઇલના કદને મર્યાદિત કરે ત્યારે આ ઉપયોગી થઈ શકે છે."
 files_filesize_response: "ફાઇલસાઇઝ મર્યાદા કરતાં વધી ગયેલી ફાઇલોનું શું કરવું (જો અસ્તિત્વમાં હોય તો). False/ખોટા = વ્હાઇટલિસ્ટ; True/સાચું = બ્લેકલિસ્ટ [ડિફૉલ્ટ]."
