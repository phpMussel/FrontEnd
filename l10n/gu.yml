 files_max_recursion: "આર્કાઇવ્સ માટે મહત્તમ પુનરાવર્તિત ઊંડાઈ મર્યાદા. ડિફૉલ્ટ = 3."
 files_only_allow_images: "જ્યારે true પર સેટ કરેલ હોય, ત્યારે સ્કેનર દ્વારા આવી કોઈપણ ફાઈલો કે જે ઈમેજ નથી તે સ્કેન કર્યા વગર તરત જ ફ્લેગ કરવામાં આવશે. આ કેટલાક કિસ્સાઓમાં સ્કેન પૂર્ણ કરવા માટે જરૂરી સમય ઘટાડવામાં મદદ કરી શકે છે. ડિફૉલ્ટ રૂપે false પર સેટ કરો."
 files_scannable_threshold: "phpMussel ને વાંચવા અને સ્કેન કરવાની અનુમતિ છે તે કાચા ડેટાની લંબાઈ સુધીનો થ્રેશોલ્ડ (સ્કેન કરતી વખતે કોઈ નોંધપાત્ર કામગીરી સમસ્યાઓ હોય તો). ડિફૉલ્ટ = 32MB. શૂન્ય અથવા નલ થ્રેશોલ્ડને અક્ષમ કરે છે. સામાન્ય રીતે, આ મૂલ્ય ફાઈલોના સરેરાશ કદ કરતાં ઓછું ન હોવું જોઈએ કે જેને તમે તમારા સર્વર અથવા વેબસાઇટ પર અપલોડ કરવા માંગો છો અથવા અપેક્ષા રાખો છો, filesize_limit ડાયરેક્ટિવ કરતાં વધુ ન હોવો જોઈએ, અને "php.ini" રૂપરેખાંકન ફાઇલ દ્વારા PHP ને આપવામાં આવેલ કુલ સ્વીકાર્ય મેમરી ફાળવણીના આશરે એક પાંચમા ભાગથી વધુ ન હોવી જોઈએ. phpMussel ને વધુ પડતી મેમરીનો ઉપયોગ કરતા અટકાવવા માટે આ નિર્દેશ અસ્તિત્વમાં છે (વધુ પડતી મેમરીનો ઉપયોગ કરવાથી તે ચોક્કસ ફાઇલ સાઇઝથી ઉપરની ફાઇલોને સફળતાપૂર્વક સ્કેન કરવામાં સક્ષમ થવાથી અટકાવશે)."
 frontend: "ફ્રન્ટ-એન્ડ માટે રૂપરેખાંકન."
 frontend_custom_footer: "બધા ફ્રન્ટ-એન્ડ પૃષ્ઠોની ખૂબ જ નીચે HTML તરીકે દાખલ કરેલ છે. જો તમે આવા તમામ પૃષ્ઠો પર કાનૂની સૂચના, સંપર્ક લિંક, વ્યવસાયની માહિતી, અથવા સમાન સમાવવા માંગતા હો તો આ ઉપયોગી થઈ શકે છે."
 frontend_custom_header: "બધા ફ્રન્ટ-એન્ડ પૃષ્ઠોની શરૂઆતમાં HTML તરીકે દાખલ કરેલ છે. જો તમે આવા તમામ પૃષ્ઠો પર વેબસાઈટનો લોગો, વ્યક્તિગત હેડર, સ્ક્રિપ્ટો, અથવા સમાન સમાવવા માંગતા હો તો આ ઉપયોગી થઈ શકે છે."
 frontend_default_algo: "ભવિષ્યના તમામ પાસવર્ડ અને સત્રો માટે કયા અલ્ગોરિધમનો ઉપયોગ કરવો તે વ્યાખ્યાયિત કરે છે."
 frontend_frontend_log: "ફ્રન્ટ-એન્ડ લૉગિન પ્રયાસોને લૉગ કરવા માટેની ફાઇલ. ફાઇલનામનો ઉલ્લેખ કરો, અથવા અક્ષમ કરવા માટે ખાલી છોડી દો."
 frontend_magnification: "ફોન્ટ મેગ્નિફિકેશન. ડિફૉલ્ટ = 1."
 frontend_max_login_attempts: "ફ્રન્ટ-એન્ડ લૉગિન પ્રયાસોની મહત્તમ સંખ્યા. ડિફૉલ્ટ = 5."
 frontend_numbers: "તમે કેવી રીતે નંબરો પ્રદર્શિત કરવાનું પસંદ કરો છો? તમારા માટે સૌથી સાચું લાગે તે ઉદાહરણ પસંદ કરો."
 frontend_theme: "phpMussel ફ્રન્ટ-એન્ડ માટે ઉપયોગ કરવા માટે સૌંદર્યલક્ષી."
 legal: "કાનૂની જરૂરિયાતો માટે રૂપરેખાંકન."
 legal_privacy_policy: "સંબંધિત ગોપનીયતા નીતિનું સરનામું કોઈપણ જનરેટ કરેલા પૃષ્ઠોના ફૂટરમાં પ્રદર્શિત કરવું. URL નો ઉલ્લેખ કરો અથવા અક્ષમ કરવા માટે ખાલી છોડી દો."
 legal_pseudonymise_ip_addresses: "લૉગિંગ કરતી વખતે IP સરનામાંને સ્યુડોનામિઝ કરો? True/સાચું = હા [ડિફૉલ્ટ]; False/ખોટા = ના."
 quarantine: "સંસર્ગનિષેધ માટે રૂપરેખાંકન."
 quarantine_quarantine_key: "જો તમે ઇચ્છો તો phpMussel બ્લોક કરેલી ફાઇલ અપલોડને ક્વોરેન્ટાઇન કરી શકે છે. કેઝ્યુઅલ વપરાશકર્તાઓ કે જેઓ ફક્ત તેમની વેબસાઇટ્સ અથવા હોસ્ટિંગ પર્યાવરણને સુરક્ષિત રાખવા ઇચ્છતા હોય, કોઈપણ ફ્લેગ કરેલ પ્રયાસ કરેલ ફાઇલ અપલોડનું ઊંડાણપૂર્વક વિશ્લેષણ કરવામાં રસ રાખ્યા વિના, આ કાર્યક્ષમતાને અક્ષમ રાખવી જોઈએ. પરંતુ, માલવેર સંશોધન માટે અથવા આવી જ વસ્તુઓ માટે ફ્લેગ કરેલ પ્રયાસ કરેલ ફાઇલ અપલોડના વધુ વિશ્લેષણમાં રસ ધરાવતા કોઈપણ વપરાશકર્તાઓએ આ કાર્યક્ષમતાને સક્ષમ કરવી જોઈએ. ફ્લેગ કરેલ પ્રયાસ કરેલ ફાઇલ અપલોડને ક્વોરેન્ટાઇન કરવું કેટલીકવાર ખોટા હકારાત્મકને ડીબગ કરવામાં પણ મદદ કરી શકે છે, જો આ તમારા માટે વારંવાર થતું હોય. સંસર્ગનિષેધ કાર્યક્ષમતાને અક્ષમ કરવા માટે, ફક્ત <code>quarantine_key</code> નિર્દેશકને ખાલી છોડી દો, અથવા જો તે પહેલાથી ખાલી ન હોય તો તે નિર્દેશની સામગ્રીને ભૂંસી નાખો. સંસર્ગનિષેધ કાર્યક્ષમતાને સક્ષમ કરવા માટે, નિર્દેશમાં અમુક મૂલ્ય દાખલ કરો. <code>quarantine_key</code> એ સંસર્ગનિષેધ કાર્યક્ષમતાનું એક મહત્વપૂર્ણ સુરક્ષા લક્ષણ છે જે સંભવિત હુમલાખોરો દ્વારા સંસર્ગનિષેધ કાર્યક્ષમતાને શોષણ કરતા અટકાવવાના સાધન તરીકે અને સંસર્ગનિષેધમાં સંગ્રહિત ડેટાના કોઈપણ સંભવિત અમલને અટકાવવાના સાધન તરીકે જરૂરી છે. <code>quarantine_key</code> ને તમારા પાસવર્ડ્સની જેમ જ વ્યવહાર કરવો જોઈએ: વધુ લંબાઈ વધુ સારી, અને તેને ચુસ્તપણે રક્ષા કરો. શ્રેષ્ઠ અસર માટે, <code>delete_on_sight</code> સાથે જોડાણમાં ઉપયોગ કરો."
 quarantine_quarantine_max_files: "સંસર્ગનિષેધમાં અસ્તિત્વમાં હોઈ શકે તેવી ફાઇલોની મહત્તમ સંખ્યા. જ્યારે ક્વોરેન્ટાઇનમાં નવી ફાઇલો ઉમેરવામાં આવે છે, જો આ સંખ્યા ઓળંગાઈ જાય, તો જૂની ફાઇલો કાઢી નાખવામાં આવશે જ્યાં સુધી બાકીની ફાઇલો આ સંખ્યા કરતાં વધી ન જાય. ડિફૉલ્ટ = 100."
 quarantine_quarantine_max_filesize: "ફાઇલોને ક્વોરેન્ટાઇન કરવા માટે મંજૂર મહત્તમ કદ. ઉલ્લેખિત મૂલ્ય કરતાં મોટી ફાઇલોને ક્વોરેન્ટાઇન કરવામાં આવશે નહીં. આ નિર્દેશ સાથે, તમે કોઈપણ સંભવિત હુમલાખોરો માટે અનિચ્છનીય ડેટા સાથે તમારા સંસર્ગનિષેધને પૂરવાનું વધુ મુશ્કેલ બનાવી શકો છો (તમારા ક્વોરટાઇનને પૂરથી તમારી હોસ્ટિંગ સેવા પર વધુ પડતા ડેટા વપરાશ તરફ દોરી શકે છે). ડિફૉલ્ટ = 2MB."
 quarantine_quarantine_max_usage: "સંસર્ગનિષેધ માટે મંજૂર મહત્તમ મેમરી વપરાશ. જો સંસર્ગનિષેધ દ્વારા ઉપયોગમાં લેવાતી કુલ મેમરી આ મૂલ્ય સુધી પહોંચે છે, તો સૌથી જૂની ક્વોરેન્ટાઇન ફાઇલો કાઢી નાખવામાં આવશે જ્યાં સુધી વપરાયેલી કુલ મેમરી હવે આ મૂલ્ય સુધી પહોંચે નહીં. આ નિર્દેશ સાથે, તમે કોઈપણ સંભવિત હુમલાખોરો માટે અનિચ્છનીય ડેટા સાથે તમારા સંસર્ગનિષેધને પૂરવાનું વધુ મુશ્કેલ બનાવી શકો છો (તમારા ક્વોરટાઇનને પૂરથી તમારી હોસ્ટિંગ સેવા પર વધુ પડતા ડેટા વપરાશ તરફ દોરી શકે છે). ડિફૉલ્ટ = 64MB."
 supplementary_cache_options: "પૂરક કેશ વિકલ્પો. નૉૅધ: આ મૂલ્યો બદલવાથી તમે સંભવિતપણે લૉગ આઉટ થઈ શકો છો."
 supplementary_cache_options_enable_apcu: "કેશીંગ માટે APCu નો ઉપયોગ કરવાનો પ્રયાસ કરવો કે કેમ. ડિફૉલ્ટ = True."
 supplementary_cache_options_enable_memcached: "કેશીંગ માટે Memcached નો ઉપયોગ કરવાનો પ્રયાસ કરવો કે કેમ. ડિફૉલ્ટ = False."
 supplementary_cache_options_enable_pdo: "કેશીંગ માટે APCu નો ઉપયોગ કરવાનો પ્રયાસ કરવો કે કેમ. ડિફૉલ્ટ = False."
 supplementary_cache_options_enable_redis: "કેશીંગ માટે Redis નો ઉપયોગ કરવાનો પ્રયાસ કરવો કે કેમ. ડિફૉલ્ટ = False."
