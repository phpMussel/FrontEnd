 core_log_rotation_action: "લોગ રોટેશન લોગ ફાઈલોની સંખ્યાને મર્યાદિત કરે છે જે કોઈપણ એક સમયે અસ્તિત્વમાં હોવી જોઈએ. જ્યારે નવી લોગ ફાઇલો બનાવવામાં આવે છે, જો લૉગ ફાઇલોની કુલ સંખ્યા નિર્દિષ્ટ મર્યાદા કરતાં વધી જાય, તો ઉલ્લેખિત ક્રિયા કરવામાં આવશે. તમે અહીં ઇચ્છિત ક્રિયાનો ઉલ્લેખ કરી શકો છો."
 core_log_rotation_limit: "લોગ રોટેશન લોગ ફાઈલોની સંખ્યાને મર્યાદિત કરે છે જે કોઈપણ એક સમયે અસ્તિત્વમાં હોવી જોઈએ. જ્યારે નવી લોગ ફાઇલો બનાવવામાં આવે છે, જો લૉગ ફાઇલોની કુલ સંખ્યા નિર્દિષ્ટ મર્યાદા કરતાં વધી જાય, તો ઉલ્લેખિત ક્રિયા કરવામાં આવશે. તમે ઇચ્છિત મર્યાદા અહીં સ્પષ્ટ કરી શકો છો. 0 નું મૂલ્ય લોગ રોટેશનને અક્ષમ કરશે."
 core_maintenance_mode: "જાળવણી મોડને સક્ષમ કરીએ? True/સાચું = હા; False/ખોટા = ના [ડિફૉલ્ટ]. ફ્રન્ટ-એન્ડ સિવાયની દરેક વસ્તુને અક્ષમ કરે છે. ક્યારેક તમારા CMS, ફ્રેમવર્ક, વગેરેને અપડેટ કરતી વખતે ઉપયોગી."
 core_outbound_request_log: "કોઈપણ આઉટબાઉન્ડ વિનંતીઓના પરિણામોને લૉગ કરવા માટેની ફાઇલ. ફાઇલનામનો ઉલ્લેખ કરો, અથવા અક્ષમ કરવા માટે ખાલી છોડી દો."
 core_scan_cache_expiry: "phpMussel સ્કેનીંગના પરિણામોને કેટલા સમય સુધી કેશ કરવા જોઈએ? મૂલ્ય એ સ્કેનિંગના પરિણામોને કેશ કરવા માટે સેકંડની સંખ્યા છે. ડિફોલ્ટ 21600 સેકન્ડ (6 કલાક) છે; 0 નું મૂલ્ય સ્કેનિંગના પરિણામોને કેશ કરવાનું અક્ષમ કરશે."
 core_scan_log: "તમામ સ્કેનિંગ પરિણામોને લૉગ . ફાઇલનામનો ઉલ્લેખ કરો, અથવા અક્ષમ કરવા માટે ખાલી છોડી દો."
 core_scan_log_serialized: "તમામ સ્કેનિંગ પરિણામોને લૉગ  (શ્રેણીબદ્ધ ફોર્મેટનો ઉપયોગ કરીને). ફાઇલનામનો ઉલ્લેખ કરો, અથવા અક્ષમ કરવા માટે ખાલી છોડી દો."
