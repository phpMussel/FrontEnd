 signatures_detect_packer_packed: "पॅकर्स आणि पॅक केलेला डेटा शोधण्यासाठी phpMussel ने स्वाक्षरी पार्स करावे का? False = नाही; True = होय [डीफॉल्ट]."
 signatures_detect_pua_pup: "PUA/PUP शोधण्यासाठी phpMussel ने स्वाक्षरी पार्स करावे का? False = नाही; True = होय [डीफॉल्ट]."
 signatures_detect_shell: "शेल स्क्रिप्ट्स शोधण्यासाठी phpMussel ने स्वाक्षरी पार्स करावे का? False = नाही; True = होय [डीफॉल्ट]."
 signatures_fail_extensions_silently: "विस्तार गहाळ असताना phpMussel ने कळवा करावी का? जर <code>fail_extensions_silently</code> अक्षम केले असेल, तर स्कॅन करताना गहाळ विस्तारांची कळवा केली जाईल, आणि जर <code>fail_extensions_silently</code> सक्षम केले असेल, तर गहाळ विस्तार दुर्लक्षित केले जातील, स्कॅनसह अहवाल देईल की त्या फायलींसाठी कोणतीही समस्या नाही. हे निर्देश अक्षम केल्याने तुमची सुरक्षितता वाढू शकते, परंतु त्यामुळे चुकीच्या पॉझिटिव्हमध्येही वाढ होऊ शकते. False = अक्षम आहे; True = सक्षम आहे [डीफॉल्ट]."
 signatures_fail_silently: "स्वाक्षरी फायली गहाळ किंवा दूषित असल्यास phpMussel ने कळवा करावी का? जर <code>fail_silently</code> अक्षम असेल, तर स्कॅन करताना गहाळ आणि दूषित फायलींची कळवा केली जाईल, and if <code>fail_silently</code> सक्षम केले असेल, तर गहाळ आणि दूषित फायली दुर्लक्षित केले जातील, स्कॅनसह अहवाल देईल की त्या फायलींसाठी कोणतीही समस्या नाही. जर तुम्हाला क्रॅश किंवा तत्सम समस्या येत असतील तरच हे बदलले पाहिजे. False = अक्षम आहे; True = सक्षम आहे [डीफॉल्ट]."
 signatures_heuristic_threshold: "काही phpMussel स्वाक्षऱ्यांचा उद्देश फायली कुठे संशयास्पद असू शकतात हे ओळखणे असतो, परंतु त्यांना थेट दुर्भावनापूर्ण म्हणून ओळखणे नसते. हे मूल्य phpMussel ला त्या फायलींना दुर्भावनापूर्ण म्हणून ध्वजांकित करण्यापूर्वी जास्तीत जास्त अनुमत वजन सांगते. या संदर्भात वजनाची व्याख्या म्हणजे संशय आणि संभाव्य द्वेषाच्या ओळखल्या जाणाऱ्या एकूण संकेतांची संख्या. डीफॉल्टनुसार, हे मूल्य 3 वर सेट केले जाईल. कमी मूल्यामुळे सहसा खोट्या पॉझिटिव्हची संख्या जास्त असते परंतु आढळलेल्या दुर्भावनापूर्ण फायलींची संख्या जास्त असते, आणि जास्त मूल्यामुळे सहसा खोट्या पॉझिटिव्हची घटना कमी होते परंतु आढळलेल्या दुर्भावनापूर्ण फायलींची संख्या कमी होते. जर तुम्हाला समस्या येत असतील तरच हे मूल्य बदलणे सहसा चांगले."
 supplementary_cache_options: "पूरक कॅशे पर्याय. टीप: ही मूल्ये बदलल्याने तुम्हाला लॉग आउट करण्याची शक्यता आहे."
 supplementary_cache_options_enable_apcu: "कॅशिंगसाठी APCu वापरून पहायचे की नाही ते निर्दिष्ट करते. डीफॉल्ट = True."
