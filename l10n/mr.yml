 core_scan_cache_expiry: "phpMussel ने स्कॅनिंगचे निकाल किती काळ कॅशे करावेत? मूल्य म्हणजे स्कॅनिंगचे निकाल कॅशे करण्यासाठी सेकंदांची संख्या. डीफॉल्ट २१६०० सेकंद (६ तास) आहे.; ० चे मूल्य स्कॅनिंगचे निकाल कॅश करणे अक्षम करेल."
