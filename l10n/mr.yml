 files_scannable_threshold: "phpMussel ला वाचण्याची आणि स्कॅन करण्याची परवानगी असलेल्या कच्च्या डेटाच्या लांबीपर्यंतचा उंबरठा (स्कॅनिंग करताना काही लक्षात येण्याजोग्या कामगिरीच्या समस्या असल्यास). डीफॉल्ट = 32MB. शून्य उंबरठा अक्षम करते. सहसा, हे मूल्य तुमच्या सर्व्हर किंवा वेबसाइटवर तुम्हाला हवे/अपेक्षित असलेल्या फाइल अपलोडच्या सरासरी आकारापेक्षा कमी नसावे, filesize_limit निर्देशापेक्षा जास्त नसावे, आणि "php.ini" कॉन्फिगरेशन फाइलद्वारे PHP ला दिलेल्या एकूण स्वीकार्य मेमरी वाटपाच्या अंदाजे एक पंचमांशपेक्षा जास्त नसावे. phpMussel ला जास्त मेमरी वापरण्यापासून रोखण्यासाठी हा निर्देश अस्तित्वात आहे (जास्त मेमरी वापरल्याने विशिष्ट फाइल आकारापेक्षा जास्त फायली यशस्वीरित्या स्कॅन करण्यापासून रोखता येते)."
