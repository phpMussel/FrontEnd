 core_log_rotation_action: "लॉग रोटेशन कोणत्याही वेळी अस्तित्वात असलेल्या लॉग फायलींची संख्या मर्यादित करते. जेव्हा नवीन लॉग फायली तयार केल्या जातात, तेव्हा लॉग फायलींची एकूण संख्या निर्दिष्ट मर्यादेपेक्षा जास्त असल्यास, निर्दिष्ट क्रिया केली जाईल. तुम्ही येथे इच्छित कृती निर्दिष्ट करू शकता."
 core_log_rotation_limit: "लॉग रोटेशन कोणत्याही वेळी अस्तित्वात असलेल्या लॉग फायलींची संख्या मर्यादित करते. जेव्हा नवीन लॉग फायली तयार केल्या जातात, तेव्हा लॉग फायलींची एकूण संख्या निर्दिष्ट मर्यादेपेक्षा जास्त असल्यास, निर्दिष्ट क्रिया केली जाईल. तुम्ही येथे इच्छित मर्यादा निर्दिष्ट करू शकता. ० चे मूल्य लॉग रोटेशन अक्षम करेल."
