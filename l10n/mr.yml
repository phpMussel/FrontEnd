 files_corrupted_exe: "दूषित फायली आणि विश्लेषण त्रुटी. False = दुर्लक्ष करा; True = अवरोधित करा.[डीफॉल्ट]. संभाव्यतः दूषित PE (पोर्टेबल एक्झिक्युटेबल) फायली शोधा आणि अवरोधित करायच्या? अनेकदा (पण नेहमीच नाही), जेव्हा PE फाइल दूषित दिसते किंवा ती पूर्णपणे योग्यरित्या पार्स केली जाऊ शकत नाही, तेव्हा ती व्हायरल इन्फेक्शनचे सूचक असू शकते. जर एखाद्या व्हायरसच्या प्रोग्रामरला अँटी-व्हायरस प्रोग्राम PE फायली कसे पार्स करतो हे माहित असेल, तर ते त्यांचा व्हायरस शोधून न काढता येण्याकरिता ते रोखण्याचा प्रयत्न करू शकतात."
 files_decode_threshold: "कच्च्या डेटाच्या लांबीसाठी उंबरठा ज्यामध्ये डीकोड कमांड शोधले पाहिजेत (स्कॅनिंग करताना काही लक्षात येण्याजोग्या कामगिरीच्या समस्या असल्यास). डीफॉल्ट = 512KB. शून्य उंबरठा अक्षम करते (फाइल आकारावर आधारित अशी कोणतीही मर्यादा काढून टाकणे)."
 files_entropy_filesize_limit: "सामान्यीकृत डेटा वापरणाऱ्या स्वाक्षऱ्यांसाठी एन्ट्रॉपी फाइल आकार मर्यादा (डीफॉल्ट 256KB आहे). जेव्हा एन्ट्रॉपी मर्यादा आणि एन्ट्रॉपी फाइल आकार मर्यादा ओलांडली जाते, तेव्हा खोट्या पॉझिटिव्हचा धोका कमी करण्यासाठी, सामान्यीकृत डेटा वापरणाऱ्या काही स्वाक्षऱ्या दुर्लक्षित केल्या जातील."
 files_entropy_limit: "सामान्यीकृत डेटा वापरणाऱ्या स्वाक्षऱ्यांसाठी एन्ट्रॉपी मर्यादा (डीफॉल्ट 7.7 आहे). या संदर्भात, एन्ट्रॉपीची व्याख्या स्कॅन केल्या जाणाऱ्या फाईलमधील मजकुराची शॅनन एन्ट्रॉपी म्हणून केली जाते. जेव्हा एन्ट्रॉपी मर्यादा आणि एन्ट्रॉपी फाइल आकार मर्यादा ओलांडली जाते, तेव्हा खोट्या पॉझिटिव्हचा धोका कमी करण्यासाठी, सामान्यीकृत डेटा वापरणाऱ्या काही स्वाक्षऱ्या दुर्लक्षित केल्या जातील."
