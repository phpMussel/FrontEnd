 core_timezone: "हे वापरण्यासाठी टाइमझोन निर्दिष्ट करण्यासाठी वापरले जाते (उदाहरणार्थ, Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, इ). PHP ला तुमच्यासाठी हे आपोआप हाताळता यावे म्हणून "SYSTEM" निर्दिष्ट करा."
 core_truncate: "लॉग फायली एका विशिष्ट आकारात पोहोचल्यावर त्या ट्रंकेट करायच्या? मूल्य म्हणजे B/KB/MB/GB/TB मध्ये कमाल आकार जो लॉग फाइल ट्रंकेट करण्यापूर्वी वाढू शकतो. 0KB चे डीफॉल्ट मूल्य ट्रंकेशन अक्षम करते (लॉग फायली अनिश्चित काळासाठी वाढू शकतात). टीप: वैयक्तिक लॉग फायलींना लागू होते! लॉग फायलींचा आकार एकत्रितपणे विचारात घेतला जात नाही."
