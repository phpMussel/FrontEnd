 urlscanner_cache_time: "API लुकअपचे निकाल किती काळ (सेकंदात) कॅशे करावेत? डीफॉल्ट ३६०० सेकंद (१ तास) आहे."
 urlscanner_google_api_key: "आवश्यक API की परिभाषित केल्यावर Google सुरक्षित ब्राउझिंग API वर API लुकअप सक्षम करते."
 urlscanner_maximum_api_lookups: "प्रत्येक वैयक्तिक स्कॅन पुनरावृत्ती करण्यासाठी API लुकअपची कमाल परवानगीयोग्य संख्या. प्रत्येक अतिरिक्त API लुकअप प्रत्येक स्कॅन पुनरावृत्ती पूर्ण करण्यासाठी लागणाऱ्या एकूण वेळेत भर घालत असल्याने, एकूण स्कॅन प्रक्रिया जलद करण्यासाठी तुम्ही मर्यादा निश्चित करू शकता. 0 वर सेट केल्यावर, अशी कोणतीही कमाल परवानगी असलेली संख्या लागू केली जाणार नाही. डीफॉल्टनुसार 10 वर सेट करा."
 urlscanner_maximum_api_lookups_response: "जर API लुकअपची कमाल परवानगी असलेली संख्या ओलांडली गेली तर काय करावे? False = काहीही करू नका (प्रक्रिया सुरू ठेवा) [डीफॉल्ट]; True = फाइल ध्वजांकित/अवरोधित करा."
 virustotal: "Virus Total एकत्रीकरणासाठी कॉन्फिगरेशन."
 virustotal_vt_public_api_key: "जर तुम्हाला हवे असेल तर, phpMussel फायली स्कॅन करते तेव्हा व्हायरस, ट्रोजन, मालवेअर आणि इतर धोक्यांपासून मोठ्या प्रमाणात वाढीव संरक्षण प्रदान करण्यासाठी Virus Total (व्हायरस टोटल) API चा वापर केला जाऊ शकतो. हे डीफॉल्टनुसार अक्षम केले आहे. ते सक्षम करण्यासाठी, Virus Total मधील API की आवश्यक आहे. याचा तुम्हाला मोठा फायदा होऊ शकतो म्हणून मी याची जोरदार शिफारस करतो. जर तुम्ही Virus Total आणि त्याच्या API च्या सेवा अटी वाचल्या असतील आणि त्यांच्याशी सहमत असाल तरच तुम्हाला हे एकत्रीकरण वैशिष्ट्य वापरण्याची परवानगी असेल. कमीत कमी, त्यांच्या दस्तऐवजीकरणाची प्रस्तावना ("VirusTotal Public API v2.0" नंतर परंतु "Contents" च्या आधी सर्वकाही)."
 virustotal_vt_quota_rate: "Virus Total API दस्तऐवजीकरणानुसार, कोणत्याही १ मिनिटाच्या कालावधीत कोणत्याही प्रकारच्या जास्तीत जास्त ४ विनंत्या मर्यादित आहेत. जर तुम्ही हनीक्लायंट, हनीपॉट किंवा इतर कोणतेही ऑटोमेशन चालवत असाल जे Virus Total संसाधने प्रदान करणार आहे आणि केवळ अहवाल पुनर्प्राप्त करणार नाही तर तुम्हाला उच्च विनंती दर कोटा मिळण्यास पात्र आहे. डीफॉल्टनुसार, phpMussel या मर्यादांचे काटेकोरपणे पालन करेल, परंतु या दर कोट्यात वाढ होण्याची शक्यता असल्याने, phpMussel ला कोणत्या मर्यादेचे पालन करावे हे निर्देश देण्यासाठी हे दोन निर्देश प्रदान केले आहेत. जर तुम्हाला असे करण्याचे निर्देश दिले असतील तरच ही मूल्ये वाढवण्याची शिफारस केली जाते, परंतु जर तुम्हाला तुमच्या दर कोट्याबाबत समस्या आल्या असतील, तर ही मूल्ये कमी केल्याने कधीकधी मदत होऊ शकते. तुमची दर मर्यादा कोणत्याही दिलेल्या <code>vt_quota_time</code> मिनिटांच्या कालावधीत कोणत्याही स्वरूपाच्या <code>vt_quota_rate</code> विनंत्या म्हणून निश्चित केली जाते."
 virustotal_vt_quota_time: "(वरील वर्णन पहा)."
 virustotal_vt_suspicion_level: "डिफॉल्टनुसार, फक्त phpMussel ज्या फायलींना "संशयास्पद" मानते त्या Virus Total API वापरून स्कॅन केल्या जातील. तुम्ही <code>vt_suspicion_level</code> निर्देशाचे मूल्य बदलून हे निर्बंध वैकल्पिकरित्या समायोजित करू शकता."
 virustotal_vt_weighting: "Virus Total API स्कॅन निकाल phpMussel द्वारे डिटेक्शन म्हणून लागू करावेत की डिटेक्शन वजन म्हणून? हे निर्देश अस्तित्वात आहेत, कारण, जरी अनेक इंजिन वापरून फाइल स्कॅन केल्याने (जसे Virus Total करते) वाढत्या संख्येने शोधले जाऊ शकतात (आणि त्यामुळे जास्त प्रमाणात दुर्भावनापूर्ण फायली पकडल्या जाऊ शकतात), त्यामुळे खोट्या पॉझिटिव्हची संख्या देखील वाढू शकते, आणि म्हणूनच, काही परिस्थितींमध्ये, स्कॅनचे निकाल निश्चित निष्कर्ष म्हणून वापरण्याऐवजी आत्मविश्वास स्कोअर म्हणून वापरणे चांगले असू शकते. जर 0 चे मूल्य वापरले असेल, तर Virus Total API स्कॅन निकाल डिटेक्शन म्हणून लागू केले जातील, आणि म्हणूनच, जर Virus Total-ने वापरलेले कोणतेही इंजिन स्कॅन केलेल्या फाइलला दुर्भावनापूर्ण म्हणून ध्वजांकित करते, तर phpMussel ती फाइल दुर्भावनापूर्ण मानेल. जर इतर कोणतेही मूल्य वापरले असेल, तर Virus Total API स्कॅन निकाल डिटेक्शन वजन म्हणून लागू केले जातील, आणि म्हणूनच, स्कॅन केल्या जाणाऱ्या फाइलला दुर्भावनापूर्ण म्हणून ध्वजांकित करणाऱ्या Virus Total द्वारे वापरल्या जाणाऱ्या इंजिनची संख्या phpMussel द्वारे स्कॅन केल्या जाणाऱ्या फाइलला दुर्भावनापूर्ण मानले पाहिजे की नाही याचा आत्मविश्वास स्कोअर म्हणून काम करेल (वापरलेले मूल्य दुर्भावनापूर्ण मानले जाण्यासाठी आवश्यक असलेले किमान आत्मविश्वास स्कोअर किंवा वजन दर्शवेल). डीफॉल्टनुसार 0 चे मूल्य वापरले जाते."
