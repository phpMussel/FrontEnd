 quarantine: "क्वारंटाइनसाठी कॉन्फिगरेशन."
 quarantine_quarantine_key: "जर तुम्हाला असे करायचे असेल तर phpMussel अवरोधित केलेल्या फाइल अपलोड क्वारंटाइन करण्यास सक्षम आहे. ज्या phpMussel वापरकर्त्यांना त्यांच्या वेबसाइट्स किंवा होस्टिंग वातावरणाचे संरक्षण करायचे आहे, त्यांना कोणत्याही ध्वजांकित प्रयत्न केलेल्या फाइल अपलोडचे सखोल विश्लेषण करण्यात रस नाही, त्यांनी ही कार्यक्षमता अक्षम ठेवावी, परंतु मालवेअर संशोधनासाठी किंवा तत्सम गोष्टींसाठी ध्वजांकित प्रयत्न केलेल्या फाइल अपलोडचे पुढील विश्लेषण करण्यात रस असलेल्या कोणत्याही वापरकर्त्यांनी ही कार्यक्षमता सक्षम करावी. वारंवार खोटे पॉझिटिव्ह आढळल्यास, कधीकधी डीबग करण्यासाठी क्वारंटाइन मदत करू शकते. क्वारंटाइन कार्यक्षमता अक्षम करण्यासाठी, फक्त <code>quarantine_key</code> निर्देश रिकामा ठेवा, किंवा जर तो निर्देश आधीच रिकामा नसेल तर त्यातील मजकूर पुसून टाका. क्वारंटाइन कार्यक्षमता सक्षम करण्यासाठी, निर्देशात काही मूल्य प्रविष्ट करा. <code>quarantine_key</code> सुरक्षिततेसाठी महत्वाचे आहे, कारण ते क्वारंटाइनमध्ये साठवलेल्या डेटाची अंमलबजावणी रोखण्यास मदत करते (उदाहरणार्थ, जर एखाद्या संभाव्य हल्लेखोराने असा डेटा अंमलात आणण्याचा प्रयत्न केला तर). <code>quarantine_key</code> ला तुमच्या पासवर्डप्रमाणेच हाताळले पाहिजे: जितके मोठे तितके चांगले, आणि ते कडकपणे जपून ठेवा. सर्वोत्तम परिणामासाठी, <code>delete_on_sight</code> सोबत वापरा."
 quarantine_quarantine_max_files: "क्वारंटाइनमध्ये जास्तीत जास्त किती फायली असू शकतात. जेव्हा क्वारंटाइनमध्ये नवीन फायली जोडल्या जातात, जर ही संख्या ओलांडली तर, जुन्या फायली हटवल्या जातील जोपर्यंत उर्वरित फायली या संख्येपेक्षा जास्त होत नाहीत. डीफॉल्ट = 100."
 quarantine_quarantine_max_filesize: "फायली क्वारंटाइन करण्यासाठी परवानगी असलेला कमाल फाइल आकार. निर्दिष्ट मूल्यापेक्षा मोठ्या फायली क्वारंटाइन केल्या जाणार नाहीत. तुमच्या होस्टिंग सेवेवर अतिरिक्त डेटा वापर होऊ शकतो अशा अवांछित डेटाने तुमच्या क्वारंटाइनमध्ये भरणे कोणत्याही संभाव्य हल्लेखोरांना अधिक कठीण बनवण्यासाठी हे निर्देश महत्त्वाचे आहेत. डीफॉल्ट = 2MB."
 quarantine_quarantine_max_usage: "क्वारंटाइनसाठी जास्तीत जास्त मेमरी वापरण्याची परवानगी. जर क्वारंटाइनद्वारे वापरलेली एकूण मेमरी या मूल्यापर्यंत पोहोचली, तर वापरलेली एकूण मेमरी या मूल्यापर्यंत पोहोचेपर्यंत सर्वात जुन्या क्वारंटाइन केलेल्या फायली हटवल्या जातील. तुमच्या होस्टिंग सेवेवर अतिरिक्त डेटा वापर होऊ शकतो अशा अवांछित डेटाने तुमच्या क्वारंटाइनमध्ये भरणे कोणत्याही संभाव्य हल्लेखोरांना अधिक कठीण बनवण्यासाठी हे निर्देश महत्त्वाचे आहेत. डीफॉल्ट = 64MB."
