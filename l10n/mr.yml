 supplementary_cache_options_prefix: "येथे निर्दिष्ट केलेले मूल्य सर्व कॅशे एंट्री कीजमध्ये प्रीपेंड केले जाईल. डीफॉल्ट = "phpMussel_". जेव्हा एकाच सर्व्हरवर अनेक इंस्टॉलेशन्स असतात, तेव्हा त्यांचे कॅशे एकमेकांपासून वेगळे ठेवण्यासाठी हे उपयुक्त ठरू शकते."
