 core_outbound_request_log: "कोणत्याही आउटबाउंड विनंत्यांच्या निकालांची नोंद करण्यासाठी एक फाइल. फाइलनाव निर्दिष्ट करा, किंवा अक्षम करण्यासाठी रिक्त सोडा."
