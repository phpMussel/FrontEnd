 files_allow_leading_trailing_dots: "फाइलनावांमध्ये अग्रगण्य आणि अनुगामी बिंदूंना परवानगी द्यायची? कधीकधी याचा वापर फायली लपवण्यासाठी किंवा काही सिस्टमना निर्देशिका ट्रॅव्हर्सल करण्यास परवानगी देण्यासाठी केला जाऊ शकतो. False = परवानगी देऊ नका [डीफॉल्ट]. True = परवानगी द्या."
 files_archive_file_extensions: "ओळखलेले संग्रहण फाइल विस्तार (स्वरूप CSV आहे; समस्या उद्भवल्यासच जोडावे किंवा काढून टाकावे; अनावश्यकपणे काढून टाकल्याने संग्रह फायलींमध्ये खोटे पॉझिटिव्ह दिसू शकतात, तर अनावश्यकपणे जोडल्याने तुम्ही हल्ला-विशिष्ट शोधातून जे जोडत आहात ते प्रभावीपणे श्वेतसूचीबद्ध होईल; काळजीपूर्वक बदल करा; हे देखील लक्षात ठेवा की याचा सामग्री-स्तरावर कोणत्या संग्रहांचे विश्लेषण केले जाऊ शकते आणि काय नाही यावर कोणताही परिणाम होत नाही). ही यादी, डिफॉल्टनुसार, बहुतेक सिस्टीम आणि CMS मध्ये सामान्यतः वापरल्या जाणाऱ्या फॉरमॅट्सची यादी करते, परंतु जाणूनबुजून ती सर्वसमावेशक नसते."
 files_block_control_characters: "कोणतेही नियंत्रण वर्ण असलेल्या कोणत्याही फायली अवरोधित करायच्या (नवीन ओळी वगळून)? जर तुम्ही फक्त साधा मजकूर अपलोड करत असाल, तर तुमच्या सिस्टमला काही अतिरिक्त संरक्षण देण्यासाठी तुम्ही हा पर्याय चालू करू शकता. तथापि, जर तुम्ही साध्या मजकुराव्यतिरिक्त काहीही अपलोड केले तर ते चालू केल्याने चुकीचे परिणाम होऊ शकतात. False = अवरोधित करू नका [डीफॉल्ट]; True = अवरोधित करा."
 files_block_encrypted_archives: "एन्क्रिप्टेड संग्रहणे शोधायची आणि अवरोधित करायची? phpMussel एन्क्रिप्टेड आर्काइव्हजमधील मजकूर स्कॅन करू शकत नसल्यामुळे, phpMussel, अँटी-व्हायरस स्कॅनर, आणि अशा इतर संरक्षणांना बायपास करण्याचा प्रयत्न करण्यासाठी आक्रमणकर्त्याद्वारे आर्काइव्ह एन्क्रिप्शनचा वापर केला जाण्याची शक्यता आहे. phpMussel ला एन्क्रिप्टेड आढळणाऱ्या कोणत्याही संग्रहांना ब्लॉक करण्याचे निर्देश दिल्यास अशा शक्यतांशी संबंधित कोणताही धोका कमी होण्यास मदत होऊ शकते. False = नाही; True = होय [डीफॉल्ट]."
 files_block_macros: "मॅक्रो असलेल्या कोणत्याही फायली अवरोधित करण्याचा प्रयत्न करायचा? काही प्रकारच्या कागदपत्रांमध्ये आणि स्प्रेडशीटमध्ये एक्झिक्युटेबल मॅक्रो असू शकतात, ज्यामुळे धोकादायक संभाव्य मालवेअर वेक्टर तयार होतो. False = अवरोधित करू नका [डीफॉल्ट]; True = अवरोधित करा."
 files_can_contain_php_file_extensions: "स्वल्पविरामाने विभक्त केलेल्या PHP कोड असण्याची परवानगी असलेल्या फाइल विस्तारांची यादी. जर PHP गिरगिट हल्ला शोध सक्षम असेल तर, ज्या फायलींमध्ये PHP कोड आहे, ज्यांचे विस्तार या यादीत नाहीत, त्या PHP गिरगिट हल्ला म्हणून आढळतील."
 files_chameleon_from_exe: "एक्झिक्युटेबल नसलेल्या आणि मान्यताप्राप्त संग्रह नसलेल्या फायलींमध्ये एक्झिक्युटेबल शीर्षलेख शोधा, आणि ज्यांचे शीर्षलेख चुकीचे आहेत असे एक्झिक्युटेबल शोधा. False = अक्षम करा; True = सक्षम करा."
