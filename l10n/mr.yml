 files_filesize_limit: "KB मध्ये फाइल आकार मर्यादा. 65536 = 64MB [डीफॉल्ट]; 0 = मर्यादा नाही (नेहमी ग्रेलिस्ट केलेले). कोणतेही (सकारात्मक) संख्यात्मक मूल्य स्वीकारले. जेव्हा तुमचे PHP कॉन्फिगरेशन एखाद्या प्रक्रियेतील मेमरीचे प्रमाण मर्यादित करते किंवा तुमचे PHP कॉन्फिगरेशन अपलोडच्या फाइल आकारावर मर्यादा घालते तेव्हा हे उपयुक्त ठरू शकते."
