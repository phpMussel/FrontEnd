 vt_suspicion_level_all: "सर्व फायली स्कॅन करा."
 vt_suspicion_level_executable: "ह्युरिस्टिक वेट, एक्झिक्युटेबल फायली, आणि एक्झिक्युटेबल डेटा असलेल्या फायली स्कॅन करा.\nएक्झिक्युटेबल फायली, आणि संभाव्यतः एक्झिक्युटेबल डेटा असलेल्या फायलींची उदाहरणे म्हणजे विंडोज PE फायली, लिनक्स ELF फायली, मॅक-ओ फायली, DOCX फायली, ZIP फायली, इत्यादी."
 vt_suspicion_level_heuristic_only: "फक्त ह्युरिस्टिक वेट असलेल्या फायली स्कॅन करा.\nजर फायलींवर काही ह्युरिस्टिक वजन असेल तरच त्या स्कॅन केल्या जातील. संभाव्य संसर्गाशी संबंधित सामान्य बोटांचे ठसे पकडण्याच्या उद्देशाने केलेल्या स्वाक्षऱ्यांमधून ह्युरिस्टिक वजन वाढू शकते (हे बोटांचे ठसे संसर्गाची हमी नाहीत). असे लुकअप, जेव्हा संशय योग्य असतो पण निश्चितता नसते तेव्हा, दुसरे मत मिळविण्यासाठी उपयुक्त ठरू शकतात."
hints_logging_datetime: "उपयुक्त टीप: वेळ स्वरूप प्लेसहोल्डर वापरून तुम्ही लॉग फायलींच्या नावांना तारीख/वेळ माहिती जोडू शकता. उपलब्ध वेळ स्वरूप प्लेसहोल्डर {{Links.ConfigRef.time_format}} वर प्रदर्शित केले जातात."
hints_pdo_dsn:
 वारंवार विचारले जाणारे प्रश्न.: "<em><a href="{{Links.phpMussel.Docs Base Path}}readme.en.md\#user-content-HOW_TO_USE_PDO" hreflang="en-AU">"PDO DSN" म्हणजे काय? मी phpMussel सह PDO कसा वापरू शकतो?</a></em>"
hints_time_format: |
 <strong><em>प्लेसहोल्डर – स्पष्टीकरण – 2024-04-30T18:27:49+08:00 वर आधारित उदाहरण.</em></strong><br />
 <code class="s">{yyyy}</code> – वर्ष – उदाहरणार्थ, 2024.<br />
 <code class="s">{yy}</code> – संक्षिप्त वर्ष – उदाहरणार्थ, 24.<br />
 <code class="s">{Mon}</code> – महिन्याचे संक्षिप्त नाव (इंग्रजीमध्ये) – उदाहरणार्थ, Apr.<br />
 <code class="s">{mm}</code> – अग्रगण्य शून्यांसह महिना – उदाहरणार्थ, 04.<br />
 <code class="s">{m}</code> – महिना – उदाहरणार्थ, 4.<br />
 <code class="s">{Day}</code> – दिवसाचे संक्षिप्त नाव (इंग्रजीमध्ये) – उदाहरणार्थ, Tue.<br />
 <code class="s">{dd}</code> – अग्रगण्य शून्यांसह दिवस – उदाहरणार्थ, 30.<br />
 <code class="s">{d}</code> – दिवस – उदाहरणार्थ, 30.<br />
 <code class="s">{hh}</code> – अग्रगण्य शून्यांसह तास (२४ तासांचा वेळ वापरतो) – उदाहरणार्थ, 18.<br />
 <code class="s">{h}</code> – तास (२४ तासांचा वेळ वापरतो) – उदाहरणार्थ, 18.<br />
 <code class="s">{ii}</code> – अग्रगण्य शून्यांसह मिनिट – उदाहरणार्थ, 27.<br />
 <code class="s">{i}</code> – मिनिट – उदाहरणार्थ, 27.<br />
 <code class="s">{ss}</code> – अग्रगण्य शून्यांसह सेकंद – उदाहरणार्थ, 49.<br />
 <code class="s">{s}</code> – सेकंद – उदाहरणार्थ, 49.<br />
 <code class="s">{tz}</code> – टाइमझोन (कोलनशिवाय) – उदाहरणार्थ, +0800.<br />
 <code class="s">{t:z}</code> – टाइमझोन (कोलनसह) – उदाहरणार्थ, +08:00.
hints_xlists:
 हे कसे काम करते.: "जर तुमची सिस्टीम फक्त विशिष्ट प्रकारच्या फायली अपलोड करण्याची परवानगी देत ​​असेल, किंवा तुमची सिस्टीम विशिष्ट प्रकारच्या फायलींना स्पष्टपणे नकार देत असेल, तर त्या फाइल प्रकारांना व्हाइटलिस्ट, ब्लॅकलिस्ट, आणि ग्रेलिस्टमध्ये निर्दिष्ट केल्याने स्क्रिप्टला काही फाइल प्रकारांकडे दुर्लक्ष करण्याची परवानगी देऊन स्कॅनचा वेग वाढवू शकतो. स्वरूप CSV (स्वल्पविरामाने विभक्त मूल्ये) आहे."
 प्रक्रियेचा तार्किक क्रम.: "जर फाइल प्रकार श्वेतसूचीबद्ध असेल, तर फाइल स्कॅन करू नका आणि अवरोधित करू नका, आणि ब्लॅकलिस्ट किंवा ग्रेलिस्टमध्ये फाइल तपासू नका. जर फाइल प्रकार ब्लॅकलिस्टमध्ये असेल, तर फाइल स्कॅन करू नका पण तरीही ती अवरोधित करा, आणि ग्रेलिस्टमध्ये फाइल तपासू नका. जर ग्रेलिस्ट रिकामी असेल किंवा ग्रेलिस्ट रिकामी नसेल आणि फाइल प्रकार ग्रेलिस्टमध्ये असेल, तर सामान्य पद्धतीने फाइल स्कॅन करा आणि स्कॅनच्या निकालांवर आधारित ती अवरोधित करायची की नाही ते ठरवा, परंतु जर ग्रेलिस्ट रिकामी नसेल आणि फाइल प्रकार ग्रेलिस्टमध्ये नसेल, तर फाइल ब्लॅकलिस्टमध्ये असेल म्हणून समजा, म्हणून ती स्कॅन करू नका तर अवरोधित करा."
