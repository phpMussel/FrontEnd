checkbox:
 Delete orphaned values: "Izbrišite napuštene vrijednosti."
config:
 core: "Opća konfiguracija (bilo koja konfiguracija jezgre koja ne pripada drugim kategorijama)."
 core_default_timeout: "Zadano vrijeme čekanja za korištenje za vanjske zahtjeve? Zadano = 12 sekundi."
 core_delete_on_sight: "Omogućavanje ove direktive uputit će skriptu da odmah pokuša izbrisati svaki skenirani pokušaj prijenosa datoteke koji odgovara bilo kojem kriteriju otkrivanja, bilo putem potpisa ili na drugi način. Datoteke označene kao "čiste" neće se dirati. U slučaju arhiva, cijela će arhiva biti izbrisana, bez obzira na to je li uvredljiva datoteka samo jedna od nekoliko datoteka sadržanih u arhivi. U slučaju skeniranja prijenosa datoteka, obično nije potrebno omogućiti ovu direktivu, jer obično će PHP automatski očistiti sadržaj svoje predmemorije kada izvođenje završi, što znači da će obično izbrisati sve datoteke koje su preko njega učitane na poslužitelj osim ako već nisu premještene, kopirane ili obrisane. Ova je direktiva dodana ovdje kao dodatna mjera sigurnosti za one čije se kopije PHP-a možda neće uvijek ponašati na očekivani način. False/Lažno = Nakon skeniranja, ostavite datoteku na miru [Zadano]; True/Istinito = Nakon skeniranja, ako nije čisto, odmah izbrišite."
 core_disabled_channels: "Ovo se može koristiti kako bi se spriječilo phpMussel da koristi određene kanale prilikom slanja zahtjeva."
 core_error_log: "Datoteka za bilježenje svih otkrivenih nefatalnih pogrešaka. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 core_hide_version: "Sakriti informacije o verziji iz zapisa i ispisa stranice? True/Istinito = Da; False/Lažno = Ne [Zadano]."
 core_ipaddr: "Gdje pronaći IP adresu zahtjeva za povezivanje? (Korisno za usluge kao što je Cloudflare). Zadano = REMOTE_ADDR. UPOZORENJE: Promijenite ovo samo ako znate što radite!"
 core_lang: "Navedite zadani jezik za phpMussel."
 core_lang_override: "Lokalizirati prema HTTP_ACCEPT_LANGUAGE kad god je to moguće? True/Istinito = Da [Zadano]; False/Lažno = Ne."
 core_log_rotation_action: "Rotacija dnevnika ograničava broj datoteka dnevnika koje bi trebale postojati u bilo kojem trenutku. Kada se kreiraju nove datoteke dnevnika, ako ukupni broj datoteka dnevnika premaši navedeno ograničenje, izvršit će se navedena radnja. Ovdje možete odrediti željenu radnju."
 core_log_rotation_limit: "Rotacija dnevnika ograničava broj datoteka dnevnika koje bi trebale postojati u bilo kojem trenutku. Kada se kreiraju nove datoteke dnevnika, ako ukupni broj datoteka dnevnika premaši navedeno ograničenje, izvršit će se navedena radnja. Ovdje možete odrediti željeni limit. Vrijednost 0 onemogućit će rotaciju dnevnika."
 core_maintenance_mode: "Omogućiti način održavanja? True/Istinito = Da; False/Lažno = Ne [Zadano]. Onemogućuje sve osim front-enda. Ponekad je korisno kada ažurirate svoj CMS, okvire, itd."
 core_outbound_request_log: "Datoteka za bilježenje rezultata svih izlaznih zahtjeva. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 core_scan_cache_expiry: "Koliko dugo phpMussel treba keširati rezultate skeniranja? Vrijednost je broj sekundi za keširanje rezultata skeniranja. Zadano je 21600 sekundi (6 sati); Vrijednost 0 onemogućit će spremanje u predmemoriju rezultata skeniranja."
 core_scan_log: "Naziv datoteke u koju se bilježe svi rezultati skeniranja. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 core_scan_log_serialized: "Naziv datoteke u koju se bilježe svi rezultati skeniranja (pomoću serijaliziranog formata). Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 core_statistics: "Pratiti statistiku korištenja phpMussela? True/Istinito = Da; False/Lažno = Ne [Zadano]."
 core_time_format: "Format zapisa datuma/vremena koji koristi phpMussel. Dodatne opcije mogu se dodati na zahtjev."
 core_time_offset: "Pomak vremenske zone u minutama."
 core_timezone: "Vremenska zona za korištenje (npr., Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, etc). Navedite "SYSTEM" kako bi PHP to automatski obradio za vas."
 core_truncate: "Skratiti datoteke dnevnika kada dostignu određenu veličinu? Vrijednost je maksimalna veličina u B/KB/MB/GB/TB do koje datoteka dnevnika može narasti prije skraćivanja. Zadana vrijednost od 0 KB onemogućuje skraćivanje (dnevničke datoteke mogu neograničeno rasti). Bilješka: Odnosi se na pojedinačne datoteke dnevnika! Veličina log datoteka ne uzima se u obzir zajedno."
 experimental: "Nestabilno/Eksperimentalno!"
 files: "Kako postupati s datotekama prilikom skeniranja."
 files_allow_leading_trailing_dots: "Dopustiti početne i završne točke u nazivima datoteka? To se ponekad može koristiti za skrivanje datoteka ili za prevaru nekih sustava da dopuste obilaženje direktorija. False/Lažno = Ne dopuštaj [Zadano]. True/Istinito = Dopuštaj."
 files_archive_file_extensions: "Prepoznati nastavci arhivskih datoteka (format je CSV; treba dodati ili ukloniti samo kada se pojave problemi; nepotrebno uklanjanje može uzrokovati pojavu lažno pozitivnih za arhivske datoteke, dok će nepotrebni dodaci u biti staviti na bijelu listu ono što dodajete iz otkrivanja specifičnih napada; modificirati s oprezom; također imajte na umu da to nema utjecaja na to koji se arhivi mogu, a koji ne mogu analizirati na razini sadržaja). Popis, kao što je zadano, navodi one formate koji se najčešće koriste u većini sustava i CMS-a, ali namjerno nije nužno sveobuhvatan."
 files_block_control_characters: "Blokirati sve datoteke koje sadrže bilo kakve kontrolne znakove (osim znakova novog reda)? Ako učitavate <strong><em>SAMO</em></strong> čisti tekst, uključivanje ove opcije može pružiti dodatnu zaštitu vašem sustavu. Međutim, ako učitavate bilo što drugo osim običnog teksta, omogućavanje ove opcije može rezultirati lažnim pozitivnim rezultatima. False/Lažno = Ne blokiraj [Zadano]; True/Istinito = Blokiraj."
 files_block_encrypted_archives: "Otkriti i blokirati šifrirane arhive? Budući da phpMussel ne može skenirati sadržaj šifriranih arhiva, moguće je da napadač može upotrijebiti enkripciju arhive kao način pokušaja zaobilaženja phpMussela, antivirusnih skenera i drugih sličnih zaštita. Uputa phpMusselu da blokira sve arhive za koje otkrije da su šifrirane potencijalno bi mogla pomoći u smanjenju takvog rizika. False/Lažno = Ne; True/Istinito = Da [Zadano]."
 files_block_macros: "Pokušajte blokirati sve datoteke koje sadrže makronaredbe? Neke vrste dokumenata i proračunskih tablica mogu sadržavati izvršne makronaredbe, što predstavlja opasan potencijalni vektor zlonamjernog softvera. False/Lažno = Ne blokiraj [Zadano]; True/Istinito = Blokiraj."
 files_can_contain_php_file_extensions: "Popis ekstenzija datoteka kojima je dopušteno sadržavati PHP kôd, odvojenih zarezima. Ako je omogućeno otkrivanje PHP kameleonskog napada, datoteke koje sadrže PHP kod, a imaju ekstenzije koje nisu na ovom popisu, bit će otkrivene kao PHP kameleonski napadi."
 files_chameleon_from_exe: "Potražite izvršna zaglavlja u datotekama koje nisu ni izvršne ni prepoznate arhive te izvršne čija su zaglavlja netočna. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_from_php: "Potražite PHP zaglavlja u datotekama koje nisu ni PHP datoteke ni prepoznate arhive. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_archive: "Otkrijte netočna zaglavlja u arhivama i komprimiranim datotekama. Podržano: BZ/BZIP2, GZ/GZIP, LZF, RAR, ZIP. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_doc: "Potražite office dokumente čija su zaglavlja netočna (Podržano: DOC, DOT, PPS, PPT, XLA, XLS, WIZ). False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_img: "Potražite slike čija su zaglavlja netočna (Podržano: BMP, DIB, PNG, GIF, JPEG, JPG, XCF, PSD, PDD, WEBP). False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_chameleon_to_pdf: "Potražite PDF datoteke čija su zaglavlja netočna. False/Lažno = Onemogućeno; True/Istinito = Omogućeno."
 files_check_archives: "Pokušati provjeriti sadržaj arhive? False/Lažno = Ne provjeravajte; True/Istinito = Provjerite [Zadano]. Podržano: Zip (zahtijeva libzip), Tar, Rar (zahtijeva rar ekstenziju)."
 files_corrupted_exe: "Oštećene datoteke i pogreške raščlanjivanje. False/Lažno = Ignorirajte; True/Istinito = Blokiraj [Zadano]. Otkriti i blokirati potencijalno oštećene PE (Portable Executable) datoteke? Često (ali ne uvijek), kada su određeni aspekti PE datoteke oštećeni ili se ne mogu ispravno analizirati, to može ukazivati ​​na virusnu infekciju. Ako je programer virusa svjestan kako antivirusni program analizira PE datoteke, može to posebno pokušati spriječiti, kako bi dopustio da njihov virus ostane neotkriven."
 files_decode_threshold: "Maksimalna duljina neobrađenih podataka gdje bi se trebale otkriti naredbe za dekodiranje (u slučaju da postoje vidljivi problemi s performansama tijekom skeniranja). Zadano = 512KB. Nula uklanja sva takva ograničenja na temelju veličine datoteke."
 files_entropy_filesize_limit: "Ograničenje veličine datoteke entropije za potpise koji koriste normalizirane podatke (zadana vrijednost je 256KB). Kada se prekorače i ograničenje entropije i ograničenje veličine datoteke entropije, kako bi se smanjio rizik od lažno pozitivnih, neki će se potpisi koji koriste normalizirane podatke zanemariti."
 files_entropy_limit: "Ograničenje entropije za potpise koji koriste normalizirane podatke (zadana vrijednost je 7.7). U ovom kontekstu, entropija se definira kao shannonova entropija sadržaja datoteke koja se skenira. Kada se prekorače i ograničenje entropije i ograničenje veličine datoteke entropije, kako bi se smanjio rizik od lažno pozitivnih, neki potpisi koji koriste normalizirane podatke će se zanemariti."
 files_filesize_archives: "Primijeniti crnu/bijelu listu veličine datoteka na sadržaj arhiva? False/Lažno = Ne (sve na sivoj listi); True/Istinito = Da [Zadano]."
 files_filesize_limit: "Ograničenje veličine datoteke u KB. 65536 = 64MB [Zadano]; 0 = Bez ograničenja (uvijek na sivoj listi). Prihvatljiva je bilo koja (pozitivna) brojčana vrijednost. To može biti korisno kada vaša PHP konfiguracija ograničava količinu memorije koju proces može zadržati ili ako vaša PHP konfiguracija ograničava veličinu datoteke za prijenos."
 files_filesize_response: "Što učiniti s datotekama koje premašuju ograničenje veličine datoteke (ako ograničenje postoji). False/Lažno = Stavi na bijelu listu; True/Istinito = Stavi na crnu listu [Zadano]."
 files_filetype_archives: "Primijeniti crnu/bijelu listu vrsta datoteka na sadržaj arhiva? False/Lažno = Ne (sve na sivoj listi) [Zadano]; True/Istinito = Da."
 files_filetype_blacklist: "Crna lista:"
 files_filetype_greylist: "Siva lista:"
 files_filetype_whitelist: "Bijela lista:"
 files_max_files_in_archives: "Maksimalan broj datoteka za skeniranje iz arhiva prije prekida skeniranja. Zadano = 0 (bez maksimuma)."
 files_max_recursion: "Maksimalno ograničenje dubine rekurzije za arhive. Zadano = 3."
 files_only_allow_images: "Kada je postavljeno na "true", sve datoteke koje skener pronađe, a nisu slike, bit će odmah označene, bez skeniranja. To u nekim slučajevima može pomoći smanjiti vrijeme potrebno za dovršetak skeniranja. Prema zadanim postavkama postavljeno na "false"."
 files_scannable_threshold: "Prag duljine sirovih podataka koje phpMussel smije čitati i skenirati (u slučaju da postoje bilo kakvi primjetni problemi s performansama tijekom skeniranja). Zadano = 32MB. Vrijednost nula onemogućuje prag. Općenito, ova vrijednost ne bi trebala biti manja od prosječne veličine datoteka koje želite i očekujete primiti na svoj poslužitelj ili web-stranicu, ne bi trebalo biti veće od direktive filesize_limit, i ne bi smjela biti veća od otprilike jedne petine ukupne dopuštene alokacije memorije dodijeljene PHP-u putem konfiguracijske datoteke "php.ini". Ova direktiva postoji kako bi se spriječilo da phpMussel koristi previše memorije (što bi ga spriječilo u uspješnom skeniranju datoteka iznad određene veličine)."
 frontend: "Konfiguracija za front-end."
 frontend_custom_footer: "Umetnuto kao HTML na samom dnu svih front-end stranica. Ovo bi moglo biti korisno u slučaju da želite uključiti pravnu obavijest, poveznicu za kontakt, poslovne informacije, ili slično na sve takve stranice."
 frontend_custom_header: "Umetnuto kao HTML na samom početku svih front-end stranica. Ovo bi moglo biti korisno u slučaju da želite uključiti logotip web stranice, personalizirano zaglavlje, skripte, ili slično na sve takve stranice."
 frontend_default_algo: "Definira koji algoritam koristiti za sve buduće lozinke i sesije."
 frontend_frontend_log: "Datoteka za bilježenje pokušaja front-end prijave. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 frontend_magnification: "Povećanje fonta. Zadano = 1."
 frontend_max_login_attempts: "Maksimalan broj pokušaja front-end prijave. Zadano = 5."
 frontend_numbers: "Kako želite da se prikazuju brojevi? Odaberite primjer koji vam se čini najispravnijim."
 frontend_theme: "Estetika koja se koristi za phpMussel front-end."
 legal: "Konfiguracija za zakonske zahtjeve."
 legal_privacy_policy: "Adresa relevantne politike privatnosti koja će biti prikazana u podnožju svih generiranih stranica. Navedite URL, ili ostavite prazno za onemogućavanje."
 legal_pseudonymise_ip_addresses: "Pseudonimizirati IP adrese prilikom prijave? True/Istinito = Da [Zadano]; False/Lažno = Ne."
 quarantine: "Konfiguracija za karantenu."
 quarantine_quarantine_key: "phpMussel može staviti blokirane prijenose datoteka u karantenu, ako to želite. Povremeni korisnici phpMussel-a koji samo žele zaštititi svoje web stranice ili okruženje za hosting, bez ikakvog interesa za dubinsku analizu bilo kakvih označenih pokušaja prijenosa datoteka trebali bi ovu funkcionalnost ostaviti onemogućenom, ali svi korisnici zainteresirani za daljnju analizu označenih pokušaja prijenosa datoteka za istraživanje zlonamjernog softvera ili slične stvari trebali bi omogućiti ovu funkcionalnost. Funkcionalnost karantene ponekad može pomoći i u otklanjanju lažno pozitivnih pogrešaka, ako vam se to često događa. Za onemogućavanje funkcionalnosti karantene, jednostavno ostavite direktivu <code>quarantine_key</code> praznom, ili je ispraznite ako već nije prazna. Da biste omogućili funkcionalnost karantene, unesite neku vrijednost u direktivu. <code>quarantine_key</code> je važna sigurnosna značajka funkcionalnosti karantene potrebna kao sredstvo sprječavanja iskorištavanja funkcionalnosti karantene od strane potencijalnih napadača i kao sredstvo sprječavanja bilo kakvog potencijalnog izvršavanja podataka pohranjenih unutar karantene. <code>quarantine_key</code> treba tretirati na isti način kao i vaše lozinke: što duže to bolje, i čvrsto je čuvajte. Za najbolji učinak, koristite zajedno s <code>delete_on_sight</code>."
 quarantine_quarantine_max_files: "Maksimalan broj datoteka koje mogu postojati u karanteni. Kada se u karantenu dodaju nove datoteke, ako se taj broj premaši, stare datoteke će se izbrisati kako bi se broj sveo ispod ovog maksimuma. Zadano = 100."
 quarantine_quarantine_max_filesize: "Maksimalna dopuštena veličina datoteke za stavljanje datoteka u karantenu. Datoteke veće od navedene vrijednosti NEĆE biti stavljene u karantenu. Ova direktiva je važna jer otežava potencijalnim napadačima da preplave vašu karantenu neželjenim podacima, što bi moglo uzrokovati prekomjerno korištenje podataka na vašoj usluzi hostinga. Zadano = 2MB."
 quarantine_quarantine_max_usage: "Maksimalna dopuštena upotreba memorije za karantenu. Ako ukupna memorija koju koristi karantena dosegne ovu vrijednost, najstarije datoteke u karanteni bit će izbrisane kako bi se ukupna korištena memorija svela ispod ove vrijednosti. Ova direktiva je važna jer otežava potencijalnim napadačima da preplave vašu karantenu neželjenim podacima, što bi moglo uzrokovati prekomjerno korištenje podataka na vašoj usluzi hostinga. Zadano = 64MB."
 signatures: "Konfiguracija za potpise, datoteke potpisa, itd."
 signatures_active: "Popis aktivnih datoteka potpisa, odvojenih zarezima. Bilješka: Datoteke potpisa prvo se moraju instalirati, prije nego što ih možete aktivirati. Da bi testne datoteke ispravno radile, datoteke potpisa moraju biti instalirane i aktivirane."
 signatures_detect_adware: "Treba li phpMussel koristiti potpise za otkrivanje adwarea? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_deface: "Treba li phpMussel koristiti potpise za otkrivanje oštećenja web stranice? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_encryption: "Treba li phpMussel otkriti i blokirati šifrirane datoteke? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_joke_hoax: "Treba li phpMussel koristiti potpise za otkrivanje zlonamjernog softvera i virusa sa šalama/prijevarama? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_packer_packed: "Treba li phpMussel koristiti potpise za otkrivanje pakera i pakiranih podataka? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_pua_pup: "Treba li phpMussel koristiti potpise za otkrivanje potencijalno neželjenih aplikacija (PUA/PUP)? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_detect_shell: "Treba li phpMussel koristiti potpise za otkrivanje shell skripti? False/Lažno = Ne; True/Istinito = Da [Zadano]."
 signatures_fail_extensions_silently: "Treba li phpMussel prijaviti kada nedostaju ekstenzije? Ako je <code>fail_extensions_silently</code> onemogućen, nedostajuća ekstenzije će se prijaviti prilikom skeniranja, a ako je <code>fail_extensions_silently</code> omogućen, nedostajuće ekstenzije će se zanemariti, a skeniranje će izvijestiti o onima datotekama za koje nema problema. Onemogućavanje ove direktive može potencijalno povećati vašu sigurnost, ali može dovesti i do povećanja lažno pozitivnih. False/Lažno = Onemogućeno; True/Istinito = Enabled [Zadano]."
 signatures_fail_silently: "Treba li phpMussel prijaviti kada datoteke potpisa nedostaju ili su oštećene? Ako je <code>fail_silently</code> onemogućen, nedostajuće i oštećene datoteke će se prijaviti prilikom skeniranja, a ako je <code>fail_silently</code> omogućen, nedostajuće i oštećene datoteke bit će zanemarene, a skeniranje će izvijestiti za one datoteke za koje nema nikakvih problema. Ovo treba promijeniti samo ako imate problema poput rušenja sustava ili slično. False/Lažno = Onemogućeno; True/Istinito = Enabled [Zadano]."
 signatures_heuristic_threshold: "Neki phpMussel potpisi namijenjeni su identificiranju datoteka koje bi mogle biti sumnjive, bez izravnog identificiranja tih datoteka kao zlonamjernih. Ova vrijednost označava maksimalnu dopuštenu težinu prije nego što phpMussel označi te datoteke kao zlonamjerne. Definicija težine u ovom kontekstu je ukupan broj identificiranih sumnjivih i potencijalno zlonamjernih pokazatelja. Prema zadanim postavkama, ova vrijednost će biti postavljena na 3. Niža vrijednost općenito će rezultirati većom pojavom lažno pozitivnih, ali većim brojem označenih zlonamjernih datoteka, dok će viša vrijednost općenito rezultirati manjom pojavom lažno pozitivnih, ali manjim brojem označenih zlonamjernih datoteka. Najbolje je promijeniti ovu vrijednost samo ako imate problema."
