 vt_suspicion_level_executable: "Skeniraj datoteke s heurističkom težinom, izvršne datoteke, i datoteke koje potencijalno sadrže izvršne podatke.\nPrimjeri izvršnih datoteka, i datoteka koje potencijalno sadrže izvršne podatke uključuju Windows PE datoteke, Linux ELF datoteke, Mach-O datoteke, DOCX datoteke, ZIP datoteke, itd."
 vt_suspicion_level_heuristic_only: "Skeniraj samo datoteke s heurističkom težinom.\nDatoteke će se skenirati samo ako imaju određenu heurističku težinu. Heuristička težina može se dobiti iz potpisa koji traže uobičajene otiske prstiju povezane s potencijalnom infekcijom, ali koji ne jamče nužno infekciju. U takvim slučajevima, može poslužiti za davanje drugog mišljenja za rezultate koji opravdavaju sumnju, ali inače ne pružaju nikakvu sigurnost."
