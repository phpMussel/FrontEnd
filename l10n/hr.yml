 Statistics: "Ova stranica prikazuje neke osnovne statistike korištenja u vezi s vašom phpMussel instalacijom."
 Upload Testing: "Stranica za testiranje učitavanja sadrži standardni obrazac za učitavanje datoteke, koji vam omogućuje da testirate hoće li phpMussel normalno blokirati datoteku pri pokušaju učitavanja."
